<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<title>KMZ + GPON Viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
:root{
  --bg:#0b1120; --panel:#111827; --panel-2:#0f172a; --line:#1f2a3f;
  --text:#e2e8f0; --muted:#7c8aa5; --accent:#38bdf8;
  --switch:#fbbf24; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
  --shadow:0 4px 20px rgba(0,0,0,.35);
}
[data-theme="light"]{
  --bg:#f7f9fc; --panel:#fff; --panel-2:#f1f5f9; --line:#e2e8f0;
  --text:#0f172a; --muted:#64748b; --accent:#0284c7;
  --ok:#15803d; --warn:#b45309; --err:#b91c1c;
  --shadow:0 4px 20px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
button,input,select{font:inherit;color:inherit}

.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);
  box-shadow:var(--shadow);position:relative;z-index:10;}
.topbar h1{font-size:15px;margin:0 8px 0 0;font-weight:600}

.mode-switch{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mode-switch button{background:var(--panel-2);border:none;padding:6px 12px;cursor:pointer;
  color:var(--muted);font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px}
.mode-switch button.active{background:var(--accent);color:#fff}
.mode-switch button:hover:not(.active){color:var(--accent)}

.main{display:grid;grid-template-columns:400px 1fr;min-height:0;overflow:hidden}
.sidebar{background:var(--panel-2);border-right:1px solid var(--line);
  padding:14px;overflow:auto;min-width:0;contain:layout style;}
.content{position:relative;min-width:0;display:flex;flex-direction:column}
#map{flex:1;min-height:0;background:var(--panel)}

.btn{background:var(--panel-2);border:1px solid var(--line);padding:6px 11px;
  border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.icon{padding:6px 9px}
.btn:disabled{opacity:.6;cursor:default}
.input{background:var(--panel-2);border:1px solid var(--line);padding:6px 10px;
  border-radius:8px;outline:none;min-width:200px;}
.input:focus{border-color:var(--accent)}
.file-btn{background:var(--panel-2);border:1px solid var(--line);padding:6px 11px;
  border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.file-btn:hover{border-color:var(--accent);color:var(--accent)}
.file-btn input{display:none}
.file-btn.active{border-color:var(--accent);color:var(--accent)}

.stats{display:flex;gap:12px;flex-wrap:wrap;align-items:center;
  margin-left:auto;color:var(--muted);font-size:12.5px;}
.stat b{color:var(--text);font-weight:600}

.iso-badge{display:inline-flex;align-items:center;gap:6px;
  background:var(--panel-2);border:1px solid var(--accent);
  color:var(--text);padding:4px 8px;border-radius:8px;font-size:12px;}
.iso-badge button{background:none;border:none;color:var(--text);
  cursor:pointer;font-size:14px;line-height:1;padding:0 2px;}
.iso-badge button:hover{color:var(--accent)}

#linkBadge{border-color:var(--switch)}
#linkBadge button:hover{color:var(--switch)}

.side-title{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;
  color:var(--muted);margin:14px 0 6px;font-weight:600;}
.side-title:first-child{margin-top:0}

/* ---------- KMZ tree ---------- */
.folder-row{display:flex;align-items:center;gap:4px;padding:3px 6px;border-radius:4px;
  font-size:13px;user-select:none;cursor:pointer}
.folder-row:hover{background:var(--panel)}
.folder-row.drop-target{background:rgba(56,189,248,.25);outline:1px dashed var(--accent)}
.folder-toggle{width:12px;color:var(--muted);font-size:10px;text-align:center;cursor:pointer}
.folder-cb{margin:0;cursor:pointer;accent-color:var(--accent)}
.folder-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder-count{color:var(--muted);font-size:11px;margin-left:4px}
.folder-actions{display:none;margin-left:auto;gap:2px}
.folder-row:hover .folder-actions{display:inline-flex}
.folder-actions button{background:none;border:none;color:var(--text);cursor:pointer;
  padding:0 3px;opacity:.75;font-size:12px}
.folder-children{margin-left:14px}
.folder-children.collapsed{display:none!important}

.route-row{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:4px;font-size:13px;user-select:none}
.route-row:hover{background:var(--panel)}
.route-row.dragging{opacity:.5}
.route-row input[type=checkbox]{margin:0;cursor:pointer;accent-color:var(--accent)}
.route-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.route-actions{display:none;gap:2px}
.route-row:hover .route-actions{display:inline-flex}
.route-actions button{background:none;border:none;color:var(--text);cursor:pointer;
  padding:0 3px;opacity:.7;font-size:12px}
.route-row.merge-marked{background:rgba(56,189,248,.15)}
.route-row.highlighted{
  background: rgba(56,189,248,.35);
  outline: 1px solid var(--accent);
  transition: background .15s ease, outline-color .15s ease;
}
.route-row.linked{
  background: rgba(251,191,36,.22);
  outline: 1px solid var(--switch);
}
.route-row.linked .route-name{
  color: var(--switch);
  font-weight: 600;
}

/* ---------- GPON filter tree ---------- */
.filter-item{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;
  cursor:pointer;user-select:none;font-size:12.5px}
.filter-item:hover{background:var(--panel)}
.filter-item input{accent-color:var(--accent)}
.filter-item .cnt{margin-left:auto;color:var(--muted);font-size:11.5px}

.filter-item.branch-highlight{
  background: rgba(56,189,248,.28);
  outline: 1px solid var(--accent);
}
.filter-item.branch-highlight .name{
  color: var(--accent);
}

.filter-item.branch-highlight-linked{
  background: rgba(251,191,36,.22);
  outline: 1px solid var(--switch);
}
.filter-item.branch-highlight-linked .name{
  color: var(--switch);
}

#filter-branch-list .filter-item .name{word-break:break-all;line-height:1.25;
  color:var(--switch);font-weight:600;font-size:12px}

.branch-group{margin:3px 0}
.branch-group-head{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;
  cursor:pointer;user-select:none;font-weight:600;font-size:12.5px;
  background:var(--panel);border:1px solid var(--line)}
.branch-group-head:hover{border-color:var(--accent);color:var(--accent)}
.branch-group-head .toggle-g{display:inline-block;width:12px;text-align:center;color:var(--muted);font-size:11px}
.branch-group-head .g-name{color:var(--accent);font-weight:700}
.branch-group-head .g-cnt{margin-left:auto;color:var(--muted);font-size:11px;font-weight:500}
.branch-group-list{padding-left:14px;border-left:1px dashed var(--line);margin-left:6px}
.branch-group.collapsed .branch-group-list{display:none}

.branch-subgroup{margin:2px 0}
.branch-subgroup-head{display:flex;align-items:center;gap:8px;padding:4px 8px;
  border-radius:6px;cursor:pointer;user-select:none;font-size:12.5px}
.branch-subgroup-head:hover{background:var(--panel)}
.branch-subgroup-head .toggle-s{display:inline-block;width:12px;text-align:center;color:var(--muted);font-size:10px}
.branch-subgroup-head .s-name{color:var(--switch);font-weight:600;word-break:break-all}
.branch-subgroup-head .s-cnt{margin-left:auto;color:var(--muted);font-size:11px}
.branch-subgroup-list{padding-left:14px;border-left:1px dashed var(--line);margin-left:6px}
.branch-subgroup.collapsed .branch-subgroup-list{display:none}

.branch-subsub{margin:1px 0}
.branch-subsub-head{display:flex;align-items:center;gap:8px;padding:3px 8px;border-radius:6px;
  cursor:pointer;user-select:none;font-size:12px}
.branch-subsub-head:hover{background:var(--panel)}
.branch-subsub-head .toggle-ss{display:inline-block;width:12px;text-align:center;color:var(--muted);font-size:10px}
.branch-subsub-head .ss-name{font-weight:500;word-break:break-all}
.branch-subsub-head .ss-cnt{margin-left:auto;color:var(--muted);font-size:11px}
.branch-subsub-list{padding-left:14px;border-left:1px dashed var(--line);margin-left:6px}
.branch-subsub.collapsed .branch-subsub-list{display:none}

.diag{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:8px 11px;margin-bottom:10px;font-family:ui-monospace,Consolas,monospace;
  font-size:11.5px;color:var(--muted);white-space:pre-wrap;line-height:1.5}

.onu-popup{font-size:12px;line-height:1.45;min-width:280px}
.onu-popup b{color:var(--accent)}
.onu-popup .stat-active{color:var(--ok);font-weight:700}
.onu-popup .stat-off{color:var(--err);font-weight:700}
.onu-popup .stat-block{color:var(--warn);font-weight:700}

/* Кнопки в попапе ONU */
.onu-popup button{
  background: var(--panel-2);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 4px 8px;
  cursor: pointer;
  font-size: 12px;
  margin-right: 4px;
}
.onu-popup button:hover{ border-color: var(--accent); color: var(--accent); }
.onu-popup button.primary{
  background: var(--accent); color: #fff; border-color: var(--accent);
}
.onu-popup button.primary:hover{ filter: brightness(1.1); color: #fff; }
.onu-popup button.warn{
  background: var(--switch); color: #111; border-color: var(--switch);
}
.onu-popup button.warn:hover{ filter: brightness(1.1); color: #111; }

/* Поля ввода координат в попапе редактирования */
.onu-edit-popup input{
  font-family: ui-monospace, Consolas, monospace;
  font-size: 12px;
  color: var(--text);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 3px 6px;
  width: 100%;
  margin-top: 2px;
}
.onu-edit-popup input:focus{
  outline: none;
  border-color: var(--accent);
}
.onu-edit-popup label{
  font-size: 11px;
  color: var(--muted);
}

/* Пульсация редактируемой метки */
.onu-marker.editable{
  cursor: grab !important;
  animation: pulse 1.2s infinite;
}
.onu-marker.editable:active{
  cursor: grabbing !important;
}
@keyframes pulse{
  0%, 100% { filter: drop-shadow(0 0 0 rgba(251,191,36,0)); }
  50%      { filter: drop-shadow(0 0 8px rgba(251,191,36,.95)); }
}

/* Подсказка снизу карты */
#editHint{
  position: absolute;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  background: rgba(15,23,42,.95);
  color: var(--text);
  border: 1px solid var(--switch);
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 13px;
  z-index: 1000;
  box-shadow: var(--shadow);
  max-width: 80%;
  text-align: center;
  pointer-events: none;
}
#editHint.hidden{ display: none; }

/* Панель «Без координат» */
.gpon-nogeo-list{
  max-height: 240px;
  overflow-y: auto;
  border: 1px solid var(--line);
  border-radius: 6px;
  margin-top: 4px;
}
.gpon-nogeo-item{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 4px 8px;
  font-size: 12px;
  border-bottom: 1px solid var(--line);
}
.gpon-nogeo-item:last-child{ border-bottom: none; }
.gpon-nogeo-item:hover{ background: var(--panel); }
.gpon-nogeo-item .addr{ flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gpon-nogeo-item button{
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--accent);
  border-radius: 4px;
  padding: 2px 6px;
  cursor: pointer;
  font-size: 11px;
  white-space: nowrap;
}
.gpon-nogeo-item button:hover{ border-color: var(--accent); }

.leaflet-popup-content-wrapper{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.leaflet-popup-tip{background:var(--panel);border:1px solid var(--line)}

.hidden{display:none!important}

@media (max-width:860px){
  .main{grid-template-columns:1fr;grid-template-rows:45% 55%}
  .sidebar{border-right:none;border-bottom:1px solid var(--line)}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>🌐 KMZ + GPON</h1>

    <div class="mode-switch" role="tablist">
      <button id="modeKmz" class="active" data-mode="kmz">🗺️ Маршруты KMZ</button>
      <button id="modeGpon" data-mode="gpon">📡 GPON</button>
    </div>

    <div id="kmzControls" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="btn" id="btnUploadFiles">📂 KMZ</button>
      <button class="btn" id="btnUploadFolder">📁 Папка</button>
      <button class="btn" id="btnNewFolder">📁+</button>
      <button class="btn" id="btnExport">💾 KMZ</button>
      <button class="btn" id="btnExportTree" title="Сохранить дерево маршрутов на диск (uploads/tree/)">📥 Выгрузить дерево</button>
      <input type="file" id="fileInput" multiple accept=".kmz,.kml" style="display:none">
      <input type="file" id="folderInput" webkitdirectory multiple style="display:none">
    </div>

    <div id="gponControls" style="display:none;gap:8px;flex-wrap:wrap;align-items:center">
      <label class="file-btn" id="fileGeoBtn">📂 Excel (geo*.xlsx)
        <input type="file" id="fileGeo" accept=".xlsx,.xls" multiple>
      </label>
      <label class="file-btn" id="fileVgBtn">📂 vgroups.csv
        <input type="file" id="fileVg" accept=".csv,.txt">
      </label>
      <button class="btn" id="reset-filters">Сбросить фильтры</button>
      <button class="btn" id="clear-gpon-data" title="Удалить сохранённые geo и vgroups">🗑 Очистить данные</button>
    </div>

    <input class="input" id="search" placeholder="🔎 Поиск…">
    <button class="btn icon" id="theme" title="Тема">🌙</button>

    <div class="iso-badge hidden" id="linkBadge" title="Связка KMZ ↔ GPON">
      <span id="linkBadgeText"></span>
      <button id="linkBadgeClear" title="Снять связку">✕</button>
    </div>

    <div class="stats">
      <span class="stat" id="statKmz">📏 <b id="s-routes">0</b> маршрутов</span>
      <span class="stat hidden" id="statGpon">🏷️ <b id="s-branches">0</b> веток · 📶 <b id="s-onus">0</b> ONU · 📍 <b id="s-matched">0</b> на карте · 🔎 <b id="s-found">—</b></span>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar" id="sidebar">
      <div id="sidebarKmz">
        <div class="side-title">Дерево маршрутов</div>
        <div id="folderTree"></div>
      </div>
      <div id="sidebarGpon" class="hidden">
        <div class="diag" id="diag">Загрузите Excel (geo*.xlsx) и vgroups.csv.</div>
        <div class="side-title">Статус ONU</div>
        <div id="filter-status"></div>
        <div class="side-title">Ветка GPON</div>
        <input class="input" id="filter-branch" placeholder="Фильтр веток…" style="width:100%;margin-bottom:6px">
        <div id="filter-branch-list"></div>
        <div class="side-title">Без координат <span id="nogeo-count" style="color:var(--muted);font-weight:400"></span></div>
        <div id="gpon-nogeo-list" class="gpon-nogeo-list"></div>
      </div>
    </aside>
    <main class="content">
      <div id="map"></div>
      <div id="editHint" class="hidden"></div>
    </main>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
'use strict';

/* ==========================================================================
   УТИЛИТЫ
   ========================================================================== */
const $ = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

function patchRoute(id, patch){
  return fetch(`/route/${id}`, {
    method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(patch),
  }).catch(err => console.error('PATCH failed', id, err));
}

function patchRoutesBulk(ids, patch){
  if (!ids || !ids.length) return Promise.resolve();
  return fetch('/routes/bulk', {
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ ids, patch }),
  }).catch(err => console.warn('bulk patch failed', err));
}

const stripBOM = s => s.charCodeAt(0) === 0xFEFF ? s.slice(1) : s;

/* ==========================================================================
   КАРТА
   ========================================================================== */
const map = L.map('map', { preferCanvas:true, zoomControl:true }).setView([45.3,38.1], 6);

const basemaps = {
  'OSM DE': L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', { maxZoom:19 }),
  'Esri Улицы': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom:19 }),
  'Esri Спутник': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom:19 }),
  'Esri Топо': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom:19 }),
  'Carto Светлая': L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom:19, subdomains:'abcd' }),
  'Carto Тёмная': L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom:19, subdomains:'abcd' }),
};
basemaps['OSM DE'].addTo(map);
L.control.layers(basemaps, null, { position:'topright', collapsed:false }).addTo(map);

/* ==========================================================================
   STATE
   ========================================================================== */
const State = {
  mode: 'kmz',
  kmz: {
    routes: [],
    layers: new Map(),
    hiddenBranches: new Set(),
    mergeMarked: new Set(),
    isolationPrev: null,
    customFolders: new Set(),
    dragPayload: null,
    search: '',
    linked: null,
  },
  gpon: {
    geo: new Map(),
    onus: [],
    byBranch: new Map(),
    filters: { status: new Set(), branch: new Set() },
    branchLayers: {},
    allMarkers: [],
    searchMode: false,
    searchHighlightLayer: null,
    geoFiles: [],
    vgFile: '',
    editMode: null,
    nogeoLayer: null,
  },
};

const K = State.kmz;
const G = State.gpon;

/* ==========================================================================
   ПЕРЕКЛЮЧАТЕЛЬ РЕЖИМОВ
   ========================================================================== */
function setMode(mode){
  if (mode !== 'kmz' && mode !== 'gpon') return;
  State.mode = mode;

  document.querySelectorAll('.mode-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });

  $('kmzControls').style.display  = (mode === 'kmz')  ? 'flex' : 'none';
  $('gponControls').style.display = (mode === 'gpon') ? 'flex' : 'none';

  $('sidebarKmz').classList.toggle('hidden', mode !== 'kmz');
  $('sidebarGpon').classList.toggle('hidden', mode !== 'gpon');

  $('statKmz').classList.toggle('hidden', mode !== 'kmz');
  $('statGpon').classList.toggle('hidden', mode !== 'gpon');

  $('search').placeholder = mode === 'kmz'
    ? '🔎 Поиск по имени, ветке, папке…'
    : '🔎 Поиск: адрес, логин, ID, ветка…';

  if (mode === 'kmz'){
    kmzRenderTree();
    kmzApplyFilters();
    $('s-routes').textContent = K.routes.length;
  } else {
    gponUpdateStats();
  }

  kmzUpdateLinkBadge();
}

document.querySelectorAll('.mode-switch button').forEach(b => {
  b.addEventListener('click', () => setMode(b.dataset.mode));
});

/* ==========================================================================
   KMZ — слои
   ========================================================================== */
function kmzStringToColor(str){
  let h = 0; for (let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) | 0;
  return `hsl(${Math.abs(h)%360}, 70%, 45%)`;
}

function kmzSimplify(points, minDist=3){
  if (points.length < 3) return points;
  const out = [points[0]];
  const R = 6371000, toRad = Math.PI/180;
  let lastLat = points[0][0], lastLon = points[0][1];
  for (let i=1; i<points.length-1; i++){
    const [lat, lon] = points[i];
    const dLat = (lat-lastLat)*toRad;
    const dLon = (lon-lastLon)*toRad;
    const a = Math.sin(dLat/2)**2 + Math.cos(lastLat*toRad)*Math.cos(lat*toRad)*Math.sin(dLon/2)**2;
    const d = 2*R*Math.asin(Math.sqrt(a));
    if (d >= minDist){ out.push([lat, lon]); lastLat = lat; lastLon = lon; }
  }
  out.push(points[points.length-1]);
  return out;
}

const _simplifiedCache = new WeakMap();

function kmzGetSimplifiedPoints(r){
  let pts = _simplifiedCache.get(r);
  if (!pts){
    pts = kmzSimplify(r.points.map(p => [p[0], p[1]]));
    _simplifiedCache.set(r, pts);
  }
  return pts;
}

function kmzBuildLayer(r){
  const pts = kmzGetSimplifiedPoints(r);
  const color = kmzStringToColor(r.branch || r.name);

  const halo = L.polyline(pts, {
    color:'#ffffff', weight:7, opacity:.75,
    lineCap:'round', lineJoin:'round', interactive:false,
  });
  const line = L.polyline(pts, {
    color, weight:3.5, opacity:.95,
    lineCap:'round', lineJoin:'round',
  });

  line.on('click', (e) => {
    L.DomEvent.stopPropagation(e);
    if (K.linked && K.linked.id === r.id){
      kmzClearLink();
    } else {
      kmzLinkRoute(r.id);
    }
  });
  line.bindTooltip(r.name, { sticky:true });

  return L.layerGroup([halo, line]);
}

function kmzRebuildLayers(){
  for (const [, layer] of K.layers) map.removeLayer(layer);
  K.layers.clear();
  for (const r of K.routes){
    const layer = kmzBuildLayer(r);
    K.layers.set(r.id, layer);
    layer.addTo(map);
  }
  kmzApplyFilters();
  kmzFitAll();
}

function kmzRemoveLayer(rid){
  const layer = K.layers.get(rid);
  if (!layer) return;
  if (map.hasLayer(layer)) map.removeLayer(layer);
  K.layers.delete(rid);
}

function kmzAddLayersFor(routes){
  let added = 0;
  for (const r of routes){
    if (K.layers.has(r.id)) continue;
    const layer = kmzBuildLayer(r);
    K.layers.set(r.id, layer);
    if (r.visible) layer.addTo(map);
    added++;
  }
  return added;
}

function kmzFitAll(){
  if (K.linked) return;
  const all = [];
  for (const layer of K.layers.values()){
    const ls = layer.getLayers ? layer.getLayers() : [layer];
    for (const l of ls){
      if (l.getLatLngs){
        try { all.push(...l.getLatLngs()); } catch(_){}
      }
    }
  }
  if (all.length){
    try { map.fitBounds(L.latLngBounds(all), { padding:[30,30] }); } catch(_){}
  }
}

function kmzFitToLinkedRoute(){
  const link = K.linked;
  if (!link) return;

  const pts = [];
  const r = K.routes.find(x => x.id === link.id);
  if (r && r.points && r.points.length){
    for (const p of r.points) pts.push([p[0], p[1]]);
  }

  const key = link.key;
  const fs  = G.filters.status;
  const activeStatusFilter = fs.size > 0;
  for (const o of G.onus){
    if (o.lat == null || o.lng == null) continue;
    if (activeStatusFilter && !fs.has(o._statusKey)) continue;
    if (!gponBranchMatchesKmz(o.branch, key)) continue;
    pts.push([o.lat, o.lng]);
  }

  if (!pts.length) return;
  try {
    map.fitBounds(L.latLngBounds(pts), { padding: [60, 60], maxZoom: 17 });
  } catch(_){}
}

function kmzApplyFilters(){
  const q = K.search.toLowerCase();
  for (const r of K.routes){
    const layer = K.layers.get(r.id);
    if (!layer) continue;

    let visible = r.visible;
    if (r.branch && K.hiddenBranches.has(r.branch)) visible = false;
    if (q){
      const hay = `${r.name} ${r.branch||''} ${r.folder||''}`.toLowerCase();
      if (!hay.includes(q)) visible = false;
    }

    if (visible){ if (!map.hasLayer(layer)) layer.addTo(map); }
    else        { if (map.hasLayer(layer)) map.removeLayer(layer); }
  }
}

/* ==========================================================================
   KMZ — дерево: сворачивание, раскрытие пути, подсветка
   ========================================================================== */
function kmzCollapseAllFolders(){
  const tree = $('folderTree');
  if (!tree) return;
  tree.querySelectorAll('.folder-children').forEach(ch => ch.classList.add('collapsed'));
  tree.querySelectorAll('.folder-toggle').forEach(t => t.textContent = '▸');
}

function kmzExpandPathTo(folderPath, routeId){
  kmzCollapseAllFolders();
  const tree = $('folderTree');
  if (!tree) return;

  const parts = (folderPath || '').split('/').filter(Boolean);
  let container = tree;

  for (const part of parts){
    let found = null;
    for (const row of container.querySelectorAll(':scope > .folder-row')){
      const nameSpan = row.querySelector('.folder-name');
      if (nameSpan && nameSpan.textContent === part){ found = row; break; }
    }
    if (!found) break;

    const children = found.nextElementSibling;
    if (children && children.classList.contains('folder-children')){
      children.classList.remove('collapsed');
      const toggle = found.querySelector('.folder-toggle');
      if (toggle) toggle.textContent = '▾';
      container = children;
    } else break;
  }

  if (routeId != null) kmzHighlightRoute(routeId);
}

function kmzCollapseExceptRoute(routeId){
  const tree = $('folderTree');
  if (!tree) return;

  tree.querySelectorAll('.folder-children').forEach(ch => ch.classList.add('collapsed'));
  tree.querySelectorAll('.folder-toggle').forEach(t => t.textContent = '▸');
  tree.querySelectorAll('.folder-row.linked').forEach(r => r.classList.remove('linked'));
  tree.querySelectorAll('.route-row.linked').forEach(r => r.classList.remove('linked'));

  const row = tree.querySelector(`.route-row[data-id="${routeId}"]`);
  if (!row) return;

  let p = row.parentElement;
  while (p && p !== tree){
    if (p.classList && p.classList.contains('folder-children')){
      p.classList.remove('collapsed');
      const prev = p.previousElementSibling;
      if (prev && prev.classList.contains('folder-row')){
        const toggle = prev.querySelector('.folder-toggle');
        if (toggle) toggle.textContent = '▾';
      }
    }
    p = p.parentElement;
  }

  row.classList.add('linked');
  try { row.scrollIntoView({ block:'center', behavior:'smooth' }); } catch(_){}
}

function kmzHighlightRoute(routeId){
  const tree = $('folderTree');
  if (!tree) return;
  tree.querySelectorAll('.route-row.highlighted')
      .forEach(el => el.classList.remove('highlighted'));
  const row = tree.querySelector(`.route-row[data-id="${routeId}"]`);
  if (!row) return;
  row.classList.add('highlighted');
  try { row.scrollIntoView({ block:'center', behavior:'smooth' }); } catch(_){}
  clearTimeout(kmzHighlightRoute._t);
  kmzHighlightRoute._t = setTimeout(() => row.classList.remove('highlighted'), 2000);
}

/* ==========================================================================
   KMZ — восстановление галочек
   ========================================================================== */
function kmzRestoreIsolationIfLinked(){
  const prev = K.isolationPrev || {};
  const toShow = [];
  for (const rr of K.routes){
    const wasVisible = !!prev[rr.id];
    if (rr.visible !== wasVisible){
      rr.visible = wasVisible;
    }
    if (wasVisible) toShow.push(rr.id);
  }
  K.isolationPrev = null;
  kmzApplyFilters();
  kmzUpdateAllTreeCheckboxes();
  if (toShow.length){
    patchRoutesBulk(toShow, { visible: true });
  }
}

map.on('click', (e) => {
  if (G.editMode && G.editMode.type === 'set'){
    L.DomEvent.stopPropagation(e);
    gponHandleMapClickForSet(e.latlng);
    return;
  }

  if (__curPopup){ __curPopup.closePopup(); __curPopup = null; }
  const stopped = e.originalEvent && e.originalEvent._stopped;

  if (!stopped && K.linked){
    kmzClearLink();
  }
  if (!stopped) gponClearBranchHighlight();
});

/* ==========================================================================
   KMZ — дерево (рендер)
   ========================================================================== */
function kmzBuildTree(){
  const root = { name:'', children:new Map(), routes:[] };
  const ensure = (parts) => {
    let n = root;
    for (const p of parts){
      if (!p) continue;
      if (!n.children.has(p)) n.children.set(p, { name:p, children:new Map(), routes:[] });
      n = n.children.get(p);
    }
    return n;
  };
  for (const r of K.routes) ensure((r.folder||'').split('/').filter(Boolean)).routes.push(r);
  for (const p of K.customFolders) ensure(p.split('/').filter(Boolean));
  return root;
}

function kmzCollectRoutes(node){
  const out = [...node.routes];
  for (const c of node.children.values()) out.push(...kmzCollectRoutes(c));
  return out;
}

function kmzRenderTree(){
  const c = $('folderTree');
  if (!c) return;
  c.innerHTML = '';
  kmzRenderNode(kmzBuildTree(), c, [], true);

  if (K.linked && K.linked.type === 'route'){
    kmzCollapseExceptRoute(K.linked.id);
    setTimeout(() => {
      if (K.linked && K.linked.type === 'route') kmzCollapseExceptRoute(K.linked.id);
    }, 0);
  }
}

function kmzRenderNode(node, container, parts, isRoot){
  const path = isRoot ? [] : [...parts, node.name];
  const pathStr = path.join('/');

  if (!isRoot && node.name){
    const row = document.createElement('div');
    row.className = 'folder-row';
    row.dataset.folderPath = pathStr;
    row.draggable = true;

    const routes = kmzCollectRoutes(node);
    const total = routes.length;
    let visible = 0;
    for (const r of routes){
      const hb = r.branch && K.hiddenBranches.has(r.branch);
      if (r.visible && !hb) visible++;
    }

    row.addEventListener('dragover', kmzFolderDragOver);
    row.addEventListener('dragleave', e => e.currentTarget.classList.remove('drop-target'));
    row.addEventListener('drop', kmzFolderDrop);
    row.addEventListener('dragstart', e => {
      K.dragPayload = { type:'folder', path:pathStr };
      e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragend', () => { K.dragPayload = null; });

    const toggle = document.createElement('span');
    toggle.className = 'folder-toggle';
    toggle.textContent = '▾';
    toggle.onclick = e => {
      e.stopPropagation();
      const ch = row.nextElementSibling;
      if (ch && ch.classList.contains('folder-children')){
        ch.classList.toggle('collapsed');
        toggle.textContent = ch.classList.contains('collapsed') ? '▸' : '▾';
      }
    };

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'folder-cb';
    cb.checked = total > 0 && visible === total;
    cb.indeterminate = visible > 0 && visible < total;
    cb.disabled = total === 0;
    cb.title = `${visible} из ${total} видимо`;

    cb.addEventListener('mousedown', e => {
      e.stopPropagation();
      row.draggable = false;
    });
    cb.addEventListener('mouseup', e => {
      e.stopPropagation();
      row.draggable = true;
    });
    cb.addEventListener('pointerdown', e => e.stopPropagation());
    cb.addEventListener('click', e => {
      e.stopPropagation();
      const want = cb.checked;
      cb.indeterminate = false;
      kmzSetFolderVisible(node, want);
    });

    const nameSpan = document.createElement('span');
    nameSpan.className = 'folder-name';
    nameSpan.textContent = node.name;
    nameSpan.title = `${node.name} — ${visible}/${total}`;
    nameSpan.onclick = e => { e.stopPropagation(); toggle.onclick(e); };

    const cnt = document.createElement('span');
    cnt.className = 'folder-count';
    cnt.textContent = total ? `${visible}/${total}` : '';

    const actions = document.createElement('span');
    actions.className = 'folder-actions';
    actions.innerHTML = `
      <button data-act="rename-folder" title="Переименовать">✏️</button>
      <button data-act="new-subfolder" title="Подпапка">📁+</button>
      <button data-act="delete-folder" title="Удалить">🗑</button>`;
    actions.querySelector('[data-act="rename-folder"]').onclick = e => { e.stopPropagation(); kmzRenameFolder(pathStr); };
    actions.querySelector('[data-act="new-subfolder"]').onclick = e => {
      e.stopPropagation();
      const sub = prompt('Имя подпапки:');
      if (!sub) return;
      const full = `${pathStr}/${sub.trim()}`;
      K.customFolders.add(full);
      kmzFolderAdd(full);
      kmzRenderTree();
    };
    actions.querySelector('[data-act="delete-folder"]').onclick = e => { e.stopPropagation(); kmzDeleteFolder(pathStr); };

    row.append(toggle, cb, nameSpan, cnt, actions);
    container.appendChild(row);

    const wrap = document.createElement('div');
    wrap.className = 'folder-children';
    container.appendChild(wrap);
    container = wrap;
  }

  for (const child of node.children.values()) kmzRenderNode(child, container, path, false);
  for (const r of node.routes) container.appendChild(kmzBuildRouteRow(r));
}

function kmzUpdateFolderCounts(){
  const tree = $('folderTree');
  if (!tree) return;

  const folders = [...tree.querySelectorAll('.folder-row')].reverse();
  for (const row of folders){
    const children = row.nextElementSibling;
    if (!children || !children.classList.contains('folder-children')) continue;

    const routes = [];
    const collectFrom = (container) => {
      for (const child of container.children){
        if (child.classList.contains('route-row')){
          const rid = parseInt(child.dataset.id, 10);
          const r = K.routes.find(x => x.id === rid);
          if (r) routes.push(r);
        } else if (child.classList.contains('folder-children')){
          collectFrom(child);
        }
      }
    };
    collectFrom(children);

    const total = routes.length;
    let visible = 0;
    for (const r of routes){
      const hb = r.branch && K.hiddenBranches.has(r.branch);
      if (r.visible && !hb) visible++;
    }

    const cnt = row.querySelector('.folder-count');
    if (cnt) cnt.textContent = total ? `${visible}/${total}` : '';

    const fcb = row.querySelector('.folder-cb');
    if (fcb){
      fcb.checked = total > 0 && visible === total;
      fcb.indeterminate = visible > 0 && visible < total;
      fcb.title = `${visible} из ${total} видимо`;
    }
  }
}

function kmzUpdateAllTreeCheckboxes(){
  const tree = $('folderTree');
  if (!tree) return;

  for (const row of tree.querySelectorAll('.route-row')){
    const rid = parseInt(row.dataset.id, 10);
    const rr = K.routes.find(x => x.id === rid);
    if (!rr) continue;
    const cb = row.querySelector('input[type="checkbox"]');
    if (cb && cb.checked !== rr.visible){
      cb.checked = rr.visible;
    }
  }

  kmzUpdateFolderCounts();
}

function kmzBuildRouteRow(r){
  const li = document.createElement('div');
  li.className = 'route-row';
  li.dataset.id = r.id;
  li.draggable = true;

  li.addEventListener('dragstart', e => {
    K.dragPayload = { type:'route', id:r.id };
    e.dataTransfer.effectAllowed = 'move';
    li.classList.add('dragging');
  });
  li.addEventListener('dragend', () => {
    K.dragPayload = null;
    li.classList.remove('dragging');
    document.querySelectorAll('.folder-row.drop-target').forEach(el => el.classList.remove('drop-target'));
  });

  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = r.visible;

  cb.addEventListener('mousedown', e => {
    e.stopPropagation();
    li.draggable = false;
  });
  cb.addEventListener('mouseup', e => {
    e.stopPropagation();
    li.draggable = true;
  });
  cb.addEventListener('click', e => e.stopPropagation());
  cb.addEventListener('pointerdown', e => e.stopPropagation());

  cb.onchange = async () => {
    r.visible = cb.checked;
    kmzApplyFilters();
    kmzUpdateFolderCounts();
    await patchRoute(r.id, { visible: r.visible });
  };

  li.appendChild(cb);

  const nameSpan = document.createElement('span');
  nameSpan.className = 'route-name';
  nameSpan.textContent = r.name;
  nameSpan.title = `${r.name}${r.branch ? ' — ' + r.branch : ''}`;
  li.appendChild(nameSpan);

  const actions = document.createElement('span');
  actions.className = 'route-actions';
  actions.innerHTML = `
    <button data-act="link-gpon" title="Связать с GPON">🔗</button>
    <button data-act="rename" title="Переименовать">✏️</button>
    <button data-act="merge" title="Отметить">${K.mergeMarked.has(r.id) ? '☑' : '◻'}</button>
    <button data-act="delete" title="Удалить">✕</button>`;
  actions.querySelector('[data-act="link-gpon"]').onclick = e => {
    e.stopPropagation();
    kmzLinkRoute(r.id);
  };
  actions.querySelector('[data-act="rename"]').onclick = async () => {
    const nn = prompt('Новое имя:', r.name);
    if (!nn) return;
    r.name = nn;
    await patchRoute(r.id, { name: nn });
    kmzRenderTree();
  };
  actions.querySelector('[data-act="merge"]').onclick = () => {
    if (K.mergeMarked.has(r.id)) K.mergeMarked.delete(r.id);
    else K.mergeMarked.add(r.id);
    kmzRenderTree();
  };
  actions.querySelector('[data-act="delete"]').onclick = async () => {
    if (!confirm(`Удалить "${r.name}"?`)) return;
    if (K.linked && K.linked.id === r.id) kmzClearLink();
    await fetch(`/route/${r.id}`, { method:'DELETE' });
    K.routes = K.routes.filter(x => x.id !== r.id);
    kmzRemoveLayer(r.id);
    kmzRenderTree();
    $('s-routes').textContent = K.routes.length;
  };
  li.appendChild(actions);

  if (K.mergeMarked.has(r.id)) li.classList.add('merge-marked');
  return li;
}

/* ==========================================================================
   KMZ — DnD
   ========================================================================== */
function kmzFolderDragOver(e){
  if (!K.dragPayload) return;
  e.preventDefault(); e.stopPropagation();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drop-target');
}
async function kmzFolderDrop(e){
  e.preventDefault(); e.stopPropagation();
  e.currentTarget.classList.remove('drop-target');
  const payload = K.dragPayload;
  if (!payload) return;
  const target = e.currentTarget.dataset.folderPath || '';
  if (payload.type === 'route') await kmzMoveRoutes([payload.id], target);
  else if (payload.type === 'folder') await kmzMoveFolder(payload.path, target);
  K.dragPayload = null;
}

async function kmzMoveRoutes(ids, folder){
  const affected = K.routes.filter(r => ids.includes(r.id));
  if (!affected.length) return;
  const oldFolders = new Set();
  for (const r of affected){
    if (r.folder) oldFolders.add(r.folder);
    r.folder = folder;
  }
  K.customFolders.delete(folder);
  kmzRenderTree();
  await patchRoutesBulk(affected.map(r => r.id), { folder });

  for (const old of oldFolders){
    const still = K.routes.some(r => r.folder === old || (r.folder||'').startsWith(old + '/'));
    if (!still && K.customFolders.has(old)){
      K.customFolders.delete(old);
      kmzFolderDelete(old);
    }
  }
}

async function kmzMoveFolder(src, dst){
  if (!src || dst === src || dst.startsWith(src + '/')) return;
  const base = src.split('/').pop();
  const np = dst ? `${dst}/${base}` : base;

  const affected = K.routes.filter(r => r.folder === src || (r.folder||'').startsWith(src + '/'));
  for (const r of affected) r.folder = np + (r.folder||'').slice(src.length);

  const upd = new Set();
  for (const f of K.customFolders){
    if (f === src) upd.add(np);
    else if (f.startsWith(src + '/')) upd.add(np + f.slice(src.length));
    else upd.add(f);
  }
  const customOnly = !affected.length && K.customFolders.has(src);
  K.customFolders = upd;

  kmzRenderTree();
  await Promise.all(affected.map(r => patchRoute(r.id, { folder: r.folder })));
  if (customOnly) await kmzFolderRename(src, np);
}

async function kmzRenameFolder(oldPath){
  const cur = oldPath.split('/').pop();
  const nn = prompt('Новое имя папки:', cur);
  if (!nn || nn === cur) return;
  const parent = oldPath.split('/').slice(0,-1).join('/');
  const np = parent ? `${parent}/${nn.trim()}` : nn.trim();

  const affected = K.routes.filter(r => r.folder === oldPath || (r.folder||'').startsWith(oldPath + '/'));
  for (const r of affected) r.folder = np + (r.folder||'').slice(oldPath.length);

  const upd = new Set();
  for (const f of K.customFolders){
    if (f === oldPath) upd.add(np);
    else if (f.startsWith(oldPath + '/')) upd.add(np + f.slice(oldPath.length));
    else upd.add(f);
  }
  K.customFolders = upd;

  kmzRenderTree();
  await Promise.all(affected.map(r => patchRoute(r.id, { folder: r.folder })));
  await kmzFolderRename(oldPath, np);
}

async function kmzDeleteFolder(path){
  const affected = K.routes.filter(r => r.folder === path || (r.folder||'').startsWith(path + '/'));
  if (affected.length && !confirm(`В папке "${path}" ${affected.length} маршрут(ов). Переместить в корень?`)) return;

  for (const r of affected) r.folder = '';
  K.customFolders.delete(path);
  for (const f of [...K.customFolders]) if (f.startsWith(path + '/')) K.customFolders.delete(f);

  kmzRenderTree();
  await patchRoutesBulk(affected.map(r => r.id), { folder: '' });
  await kmzFolderDelete(path);
}

function kmzSetFolderVisible(node, visible){
  const routes = kmzCollectRoutes(node);
  if (!routes.length) return;
  for (const r of routes){
    r.visible = visible;
    if (r.branch){
      if (visible) K.hiddenBranches.delete(r.branch);
      else K.hiddenBranches.add(r.branch);
    }
  }
  kmzApplyFilters();
  kmzRenderTree();
  patchRoutesBulk(routes.map(r => r.id), { visible });
}

/* ==========================================================================
   KMZ — API-помощники и загрузка
   ========================================================================== */
async function kmzFolderAdd(path){
  try {
    await fetch('/folders', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ path }),
    });
  } catch(e){ console.warn('folder add failed', e); }
}
async function kmzFolderDelete(path){
  try {
    await fetch('/folders', {
      method:'DELETE', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ path }),
    });
  } catch(e){ console.warn('folder delete failed', e); }
}
async function kmzFolderRename(oldPath, newPath){
  try {
    await fetch('/folders/rename', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ old: oldPath, new: newPath }),
    });
  } catch(e){ console.warn('folder rename failed', e); }
}

async function kmzLoadRoutes(){
  const res = await fetch('/routes');
  const fresh = await res.json();

  const wasEmpty = K.routes.length === 0;
  const oldIds = new Set(K.routes.map(r => r.id));
  const newIds = new Set(fresh.map(r => r.id));

  for (const id of oldIds){
    if (!newIds.has(id)) kmzRemoveLayer(id);
  }

  const oldById = new Map(K.routes.map(r => [r.id, r]));
  K.routes = fresh.map(r => {
    const prev = oldById.get(r.id);
    if (prev && prev.points === r.points) return prev;
    return r;
  });

  kmzRenderTree();

  const brandNew = K.routes.filter(r => !oldIds.has(r.id));
  const addedCount = kmzAddLayersFor(brandNew);

  if (wasEmpty || addedCount > 0) kmzFitAll();
  kmzApplyFilters();

  $('s-routes').textContent = K.routes.length;
}

/* ==========================================================================
   KMZ ↔ GPON: связка по конкретному маршруту
   ========================================================================== */
function gponBranchMatchesKmz(gponBranch, kmzKey){
  if (!gponBranch || !kmzKey) return false;
  const gb = String(gponBranch).toLowerCase();
  const kk = String(kmzKey).toLowerCase();

  if (gb === kk) return true;
  if (gb.endsWith('/' + kk)) return true;

  const gbParts = gb.split('/');
  const kkParts = kk.split('/');
  if (kkParts.length <= gbParts.length){
    let match = true;
    for (let i = 0; i < kkParts.length; i++){
      if (gbParts[gbParts.length - kkParts.length + i] !== kkParts[i]){
        match = false; break;
      }
    }
    if (match) return true;
  }
  return false;
}

function gponApplyKmzLinkFilter(){
  const link = K.linked;
  if (!link){
    gponApplyFilters();
    return;
  }
  const key = link.key;

  const fs = G.filters.status;
  const activeStatusFilter = fs.size > 0;

  const wanted = new Map();
  for (const m of G.allMarkers){
    const o = m.__onu;
    if (o.lat == null) continue;
    if (activeStatusFilter && !fs.has(o._statusKey)) continue;
    if (!gponBranchMatchesKmz(o.branch, key)) continue;
    let arr = wanted.get(o.branch);
    if (!arr){ arr = []; wanted.set(o.branch, arr); }
    arr.push(m);
  }

  for (const branch in G.branchLayers){
    const cluster = G.branchLayers[branch];
    const arr = wanted.get(branch) || [];
    const has = arr.length > 0;
    const on  = map.hasLayer(cluster);

    if (has && !on && !G.searchMode) cluster.addTo(map);
    if (!has && on) map.removeLayer(cluster);

    if (!has) continue;

    const cur = _clusterMembers.get(branch);
    if (cur && cur.size === arr.length){
      let same = true;
      for (const m of arr){
        if (!cur.has(m)){ same = false; break; }
      }
      if (same) continue;
    }
    cluster.clearLayers();
    cluster.addLayers(arr);
    _clusterMembers.set(branch, new Set(arr));
  }
}

function gponHighlightLinkedBranches(){
  const root = $('filter-branch-list');
  if (!root) return;

  root.querySelectorAll('.filter-item.branch-highlight-linked')
      .forEach(el => el.classList.remove('branch-highlight-linked'));

  const link = K.linked;
  if (!link) return;
  const key = link.key;

  for (const el of root.querySelectorAll('.filter-item')){
    const cb = el.querySelector('input[data-filter="branch"]');
    if (!cb) continue;
    if (gponBranchMatchesKmz(cb.value, key)){
      el.classList.add('branch-highlight-linked');
    }
  }
}

function kmzLinkRoute(routeId){
  const r = K.routes.find(x => x.id === routeId);
  if (!r) return;

  if (K.linked && K.linked.id === routeId){
    kmzClearLink();
    return;
  }

  if (K.linked){
    kmzRestoreIsolationIfLinked();
  }

  const key = r.branch || r.name;
  K.linked = { type: 'route', id: r.id, key, folder: r.folder || '' };

  K.isolationPrev = {};
  for (const rr of K.routes){
    K.isolationPrev[rr.id] = !!rr.visible;
  }

  const toShow = [r.id];
  const toHide = [];
  for (const rr of K.routes){
    const wantVisible = (rr.id === r.id);
    if (rr.visible !== wantVisible){
      rr.visible = wantVisible;
    }
    if (!wantVisible) toHide.push(rr.id);
  }

  kmzApplyFilters();
  kmzUpdateAllTreeCheckboxes();

  if (toHide.length) patchRoutesBulk(toHide, { visible: false });
  patchRoutesBulk(toShow, { visible: true });

  kmzUpdateLinkBadge();
  gponApplyKmzLinkFilter();
  gponHighlightLinkedBranches();

  kmzFitToLinkedRoute();
  setTimeout(() => {
    if (K.linked && K.linked.id === routeId) kmzFitToLinkedRoute();
  }, 150);

  kmzCollapseExceptRoute(routeId);
  setTimeout(() => {
    if (K.linked && K.linked.id === routeId) kmzCollapseExceptRoute(routeId);
  }, 0);

  document.querySelectorAll('#filter-branch-list .branch-group, #filter-branch-list .branch-subgroup, #filter-branch-list .branch-subsub')
    .forEach(p => {
      if (p.classList.contains('collapsed')){
        p.classList.remove('collapsed');
        const head = p.querySelector(':scope > .branch-group-head, :scope > .branch-subgroup-head, :scope > .branch-subsub-head');
        if (head){
          const tt = head.querySelector('.toggle-g, .toggle-s, .toggle-ss');
          if (tt) tt.textContent = '▾';
        }
      }
    });
}

function kmzClearLink(){
  if (!K.linked) return;

  kmzRestoreIsolationIfLinked();
  K.linked = null;

  const tree = $('folderTree');
  if (tree){
    tree.querySelectorAll('.folder-row.linked').forEach(r => r.classList.remove('linked'));
    tree.querySelectorAll('.route-row.linked').forEach(r => r.classList.remove('linked'));

/* ==========================================================================
   GPON — парсинг
   ========================================================================== */
function gponDecodeBytes(buf){
  for (const enc of ['utf-8','windows-1251','koi8-r','iso-8859-5']){
    try{
      const t = new TextDecoder(enc, { fatal:true }).decode(buf);
      if (/[А-Яа-яЁё]/.test(t) && !t.includes('\uFFFD')) return stripBOM(t);
    }catch(_){}
  }
  return stripBOM(new TextDecoder('windows-1251').decode(buf));
}
function gponDetectDelim(line){
  const c = { ';': (line.match(/;/g)||[]).length, '\t': (line.match(/\t/g)||[]).length, ',': (line.match(/,/g)||[]).length };
  let best = ';', max = 0;
  for (const [d, n] of Object.entries(c)) if (n > max){ max = n; best = d; }
  return best;
}
function gponParseCSV(text, delim){
  const rows = [];
  let i = 0, len = text.length, row = [], field = '', inQ = false;
  while (i < len){
    const ch = text[i];
    if (inQ){
      if (ch === '"'){
        if (text[i+1] === '"'){ field += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      const next = text.indexOf('"', i);
      if (next < 0){ field += text.slice(i); i = len; break; }
      field += text.slice(i, next); i = next; continue;
    }
    if (ch === '"'){ inQ = true; i++; continue; }
    if (ch === delim){ row.push(field); field = ''; i++; continue; }
    if (ch === '\n' || ch === '\r'){
      row.push(field); rows.push(row); row = []; field = '';
      i += (ch === '\r' && text[i+1] === '\n') ? 2 : 1;
      continue;
    }
    const nd = text.indexOf(delim, i), nn = text.indexOf('\n', i), nr = text.indexOf('\r', i);
    let next = -1;
    for (const c of [nd, nn, nr]) if (c >= 0 && (next < 0 || c < next)) next = c;
    if (next < 0){ field += text.slice(i); i = len; break; }
    field += text.slice(i, next); i = next;
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}
const GPON_RE_ADDR = [
  [/ё/g,'е'], [/[«»"'`]/g,''], [/\s+/g,' '], [/[(){}\[\]]/g,''],
  [/\bдом\b/g,'д'], [/\bд\.\s*/g,'д '], [/\bкв\.?\s*/g,'кв '],
  [/\bкорп\.?\s*/g,'корп '], [/\bул\.\s*/g,'ул '], [/\bпер\.\s*/g,'пер '],
  [/\bснт\.?\s*/g,'снт '], [/\bтер\.?\s*/g,'тер '], [/,\s*,/g,','],
];
function gponNormAddr(a){
  if (!a) return '';
  let s = String(a).toLowerCase();
  for (const [re, to] of GPON_RE_ADDR) s = s.replace(re, to);
  return s.trim();
}
function gponBranch(login){
  if (!login) return 'Прочее';
  const head = login.split(':')[0];
  const p = head.split('/');
  if (p.length < 5) return head;
  return p[0] + '/' + p[3] + '/' + p[4];
}
function gponStatusKey(s){
  if (/Активна/i.test(s)) return 'active';
  if (/Отключена/i.test(s)) return 'off';
  if (/Заблокирована/i.test(s)) return 'block';
  return 'other';
}
const GPON_STATUS_COLOR = { active:'#22c55e', off:'#94a3b8', block:'#ef4444', other:'#22c55e' };
const GPON_STATUS_CLASS = { active:'stat-active', off:'stat-off', block:'stat-block', other:'' };

async function gponLoadState(){
  try {
    const res = await fetch('/gpon/state');
    const data = await res.json();
    const hasGeo  = data.geo  && Object.keys(data.geo).length > 0;
    const hasOnus = data.onus && data.onus.length > 0;
    if (!hasGeo && !hasOnus) return false;

    G.geo = new Map(Object.entries(data.geo || {}));

    G.onus = (data.onus || []).map(o => {
      const g = G.geo.get(gponNormAddr(o.address));
      return {
        ...o,
        lat: g ? g.lat : null,
        lng: g ? g.lng : null,
        _statusKey: gponStatusKey(o.status || ''),
      };
    });

    G.byBranch = new Map();
    for (const o of G.onus){
      if (!G.byBranch.has(o.branch)) G.byBranch.set(o.branch, []);
      G.byBranch.get(o.branch).push(o);
    }
    G.geoFiles = data.geoFiles || [];
    G.vgFile   = data.vgFile   || '';

    if (G.geoFiles.length){
      $('fileGeoBtn').classList.add('active');
      $('fileGeoBtn').childNodes[0].nodeValue = `📂 Excel × ${G.geoFiles.length} `;
    }
    if (G.vgFile){
      $('fileVgBtn').classList.add('active');
      $('fileVgBtn').childNodes[0].nodeValue = `📂 ${G.vgFile} `;
    }

    const matched = G.onus.filter(o => o.lat != null).length;
    $('diag').textContent =
      `geo: ${G.geo.size} адресов` +
      (G.geoFiles.length ? ` (файлов: ${G.geoFiles.length})` : '') + `\n` +
      `ONU: ${G.onus.length}, на карте ${matched}` +
      (G.vgFile ? ` (${G.vgFile})` : '');

    if (G.onus.length){
      gponBuildStatusFilter();
      gponBuildBranchFilter();
      gponBuildLayers();
      gponUpdateStats();
    }
    return true;
  } catch(e){
    console.warn('gpon state load failed', e);
    return false;
  }
}

async function gponClearState(){
  if (!confirm('Удалить сохранённые geo и vgroups? Это действие необратимо.')) return;

  for (const k in G.branchLayers){

   GPON — маркеры и попапы
   ========================================================================== */
const GPON_ICON_CACHE = {};

let _markersByBranch = new Map();
let _clusterMembers = new Map();

function gponGetIcon(color){
  if (GPON_ICON_CACHE[color]) return GPON_ICON_CACHE[color];
  return GPON_ICON_CACHE[color] = L.divIcon({
    className:'onu-marker',
    html:`<div style="background:${color};width:14px;height:14px;border-radius:50%;
      border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.6)"></div>`,
    iconSize:[14,14], iconAnchor:[7,7],
  });
}

let __curPopup = null;

function gponBindPopup(layer){
  layer.bindPopup(gponBuildPopup(layer.__onu), {
    closeButton:false, offset:[0,-5], autoClose:false, closeOnClick:false, autoPan:false,
  });

  layer.off('mouseover');
  layer.off('click');
  layer.off('popupopen');

  layer.on('mouseover', function(){
    if (layer._editModeActive) return;
    if (__curPopup && __curPopup !== this) __curPopup.closePopup();
    __curPopup = this;
    this.openPopup();
  });

  layer.on('click', function(e){
    L.DomEvent.stopPropagation(e);
    if (layer._editModeActive) return;
    gponHighlightBranchInTree(layer.__onu.branch);
  });

  layer.on('popupopen', function(){
    const popupEl = layer.getPopup().getElement();
    if (!popupEl) return;

    popupEl.addEventListener('mousedown', (ev) => {
      ev.stopPropagation();
    });
    popupEl.addEventListener('click', (ev) => {
      ev.stopPropagation();

      const btn = ev.target.closest('button');
      if (!btn) return;

      const action = btn.dataset.action;

      if (action === 'save'){
        ev.preventDefault();
        gponSaveEditedMarker(layer);
        return;
      }
      if (action === 'cancel'){
        ev.preventDefault();
        gponCancelEditMarker(layer);
        return;
      }
      if (btn.id && btn.id.startsWith('onu-edit-')){
        if (layer._editModeActive) return;
        ev.preventDefault();
        gponStartEditMarker(layer);
      }
    });
  });
}

function gponBuildPopup(o){
  const hasCoords = (o.lat != null && o.lng != null);
  return `<div class="onu-popup">
    <div><b>Ветка:</b> ${esc(o.branch)}</div>
    <div><b>ONU ID:</b> ${esc(o.id)}</div>
    <div><b>Логин:</b> ${esc(o.login)}</div>
    <div><b>Статус:</b> <span class="${GPON_STATUS_CLASS[o._statusKey]||''}">${esc(o.status)}</span></div>
    <hr style="margin:5px 0;border:none;border-top:1px solid #ddd">
    <div><b>Адрес:</b> ${esc(o.address)}</div>
    <div style="margin-top:6px">
      <button type="button" id="onu-edit-${esc(o.id)}" class="warn">📌 ${hasCoords ? 'Перетащить' : 'Указать место'}</button>
    </div>
  </div>`;
}

function gponBuildLayers(){
  for (const k in G.branchLayers){
    map.removeLayer(G.branchLayers[k]);
    delete G.branchLayers[k];
  }
  G.allMarkers.length = 0;
  _markersByBranch = new Map();
  _clusterMembers  = new Map();

  G.byBranch.forEach((onus, branch) => {
    const cluster = L.markerClusterGroup({
      maxClusterRadius:45, disableClusteringAtZoom:17,
      showCoverageOnHover:false, chunkedLoading:true,
      chunkInterval:100, chunkDelay:30,
    });
    const arr = [];
    for (const p of onus){
      if (p.lat == null) continue;
      const m = L.marker([p.lat, p.lng], {
        icon: gponGetIcon(GPON_STATUS_COLOR[p._statusKey]),
        draggable: false,
      });
      m.__onu = p;
      gponBindPopup(m);
      arr.push(m);
      G.allMarkers.push(m);
    }
    cluster.addLayers(arr);
    G.branchLayers[branch] = cluster;
    _markersByBranch.set(branch, arr);
    _clusterMembers.set(branch, new Set(arr));
    cluster.addTo(map);
  });

  gponApplyKmzLinkFilter();

  if (K.linked){
    setTimeout(() => kmzFitToLinkedRoute(), 150);
  }

  gponRebuildNogeoList();
}

function gponApplyFilters(){
  const fs = G.filters.status;
  const fb = G.filters.branch;
  const activeStatusFilter = fs.size > 0;
  const activeBranchFilter = fb.size > 0;

  const wanted = new Map();
  for (const m of G.allMarkers){
    const o = m.__onu;
    if (o.lat == null) continue;
    if (activeStatusFilter && !fs.has(o._statusKey)) continue;
    if (activeBranchFilter && !fb.has(o.branch))     continue;
    let arr = wanted.get(o.branch);
    if (!arr){ arr = []; wanted.set(o.branch, arr); }
    arr.push(m);
  }

  for (const branch in G.branchLayers){
    const cluster = G.branchLayers[branch];
    const arr = wanted.get(branch) || [];
    const has = arr.length > 0;
    const on  = map.hasLayer(cluster);

    if (has && !on && !G.searchMode) cluster.addTo(map);
    if (!has && on) map.removeLayer(cluster);

    if (!has) continue;

    const cur = _clusterMembers.get(branch);
    if (cur && cur.size === arr.length){
      let same = true;
      for (const m of arr){
        if (!cur.has(m)){ same = false; break; }
      }
      if (same) continue;
    }

    cluster.clearLayers();
    cluster.addLayers(arr);
    _clusterMembers.set(branch, new Set(arr));
  }
}

   GPON — редактирование геометок

function gponGeoKeyForOnu(o){
  return gponNormAddr(o.address);
}

function gponStartEditMarker(marker){
  const o = marker.__onu;

  G.editMode = {
    type: 'move',
    onuId: o.id,
    marker,
    originalLat: o.lat,
    originalLng: o.lng,
    originalGeoKey: gponGeoKeyForOnu(o),
  };

  if (marker.dragging) marker.dragging.enable();
  marker.setZIndexOffset(9999);

  const el = marker.getElement();
  if (el) el.classList.add('editable');

  marker._editModeActive = true;

  marker.closePopup();

  const curLat = o.lat != null ? o.lat.toFixed(7) : '';
  const curLng = o.lng != null ? o.lng.toFixed(7) : '';

  marker.setPopupContent(`
    <div class="onu-popup onu-edit-popup">
      <div><b>Ветка:</b> ${esc(o.branch)}</div>
      <div><b>ONU ID:</b> ${esc(o.id)}</div>
      <div><b>Логин:</b> ${esc(o.login)}</div>
      <div style="margin-top:6px;display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <label>Широта
          <input type="text" id="onu-lat-${esc(o.id)}" value="${curLat}"
            inputmode="decimal" autocomplete="off" />
        </label>
        <label>Долгота
          <input type="text" id="onu-lng-${esc(o.id)}" value="${curLng}"
            inputmode="decimal" autocomplete="off" />
        </label>
      </div>
      <div style="margin-top:8px">
        <button type="button" class="primary" data-action="save">✓ Сохранить</button>
        <button type="button" data-action="cancel">↺ Отменить</button>
      </div>
      <div style="color:var(--muted);font-size:11px;margin-top:4px">
        Введите координаты или перетащите метку.
      </div>
    </div>
  `);

  marker.openPopup();

  setTimeout(() => {
    const latEl = document.getElementById(`onu-lat-${o.id}`);
    const lngEl = document.getElementById(`onu-lng-${o.id}`);
    if (!latEl || !lngEl) return;

    // При перетаскивании маркера — подставить новые координаты в поля.
    const syncInputsFromMarker = () => {
      const ll = marker.getLatLng();
      latEl.value = ll.lat.toFixed(7);
      lngEl.value = ll.lng.toFixed(7);
    };

    marker.on('drag',  syncInputsFromMarker);
    marker.on('dragend', () => {
      syncInputsFromMarker();
      if (!marker.isPopupOpen()) marker.openPopup();
    });
  }, 0);

  gponShowEditHint('Введите координаты вручную или перетащите метку, затем «✓ Сохранить».');
}

async function gponSaveEditedMarker(marker){
  const o = marker.__onu;

  const latEl = document.getElementById(`onu-lat-${o.id}`);
  const lngEl = document.getElementById(`onu-lng-${o.id}`);

  let newLat = null, newLng = null;
  let hasManual = false;

  if (latEl && lngEl){
    const latV = String(latEl.value).trim().replace(',', '.');
    const lngV = String(lngEl.value).trim().replace(',', '.');

    if (latV !== '' && lngV !== ''){
      const lat = parseFloat(latV);
      const lng = parseFloat(lngV);
      if (!isFinite(lat) || !isFinite(lng) ||
          Math.abs(lat) > 90 || Math.abs(lng) > 180){
        alert('Некорректные координаты. Широта: -90..90, долгота: -180..180.');
        return;
      }
      newLat = lat;
      newLng = lng;
      hasManual = true;
    }
  }

  if (!hasManual){
    const latlng = marker.getLatLng();
    newLat = latlng.lat;
    newLng = latlng.lng;
  }

  o.lat = newLat;
  o.lng = newLng;
  marker.setLatLng([newLat, newLng]);

  const key = gponGeoKeyForOnu(o);
  G.geo.set(key, { lat: newLat, lng: newLng, address: o.address });

  try {
    const res = await fetch('/gpon/geo/point', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        addr: key,
        lat: newLat,
        lng: newLng,
        address: o.address,
      }),
    });
    if (!res.ok){
      console.warn('server returned', res.status);
    }
  } catch(e){
    console.warn('save geo point failed', e);
  }

  if (marker.dragging) marker.dragging.disable();
  marker.setZIndexOffset(0);
  marker._editModeActive = false;

  marker.off('drag');
  marker.off('dragend');

  const el = marker.getElement();
  if (el) el.classList.remove('editable');
  G.editMode = null;
  gponHideEditHint();

  marker.closePopup();
  gponBindPopup(marker);
  gponUpdateStats();
}

function gponCancelEditMarker(marker){

  const o = marker.__onu;

  if (el) el.classList.remove('editable');
  G.editMode = null;
  gponHideEditHint();

  marker.closePopup();
  gponBindPopup(marker);
}

function gponHighlightBranchInTree(branch){
  const root = $('filter-branch-list');
  if (!root) return;

  gponClearBranchHighlight();
  if (!branch) return;

  const all = root.querySelectorAll('.filter-item');
  let target = null;
  for (const el of all){
    const cb = el.querySelector('input[data-filter="branch"]');
    if (cb && cb.value === branch){ target = el; break; }
  }
  if (!target) return;

  target.classList.add('branch-highlight');

  let p = target.parentElement;
  while (p && p !== root){
    if (p.classList.contains('collapsed')){
      p.classList.remove('collapsed');
      const head = p.querySelector(':scope > .branch-group-head, :scope > .branch-subgroup-head, :scope > .branch-subsub-head');

      }
    }
    p = p.parentElement;
  }

  try { target.scrollIntoView({ block:'center', behavior:'smooth' }); } catch(_){}
}

/* ==========================================================================
   GPON — разбор Excel и CSV
   ========================================================================== */
function gponParseGeoWorkbook(buf, fname, out){
  const wb = XLSX.read(buf, { type:'array' });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:true });
  let h = -1;
  for (let i = 0; i < Math.min(rows.length, 30); i++){
    const r = rows[i];
    if (r && r.some(c => String(c).trim() === 'Широта')){ h = i; break; }
  }
  if (h < 0) throw new Error(`«${fname}»: нет столбца «Широта»`);
  const header = rows[h];
  const cLat = header.findIndex(x => String(x).trim() === 'Широта');
  const cLng = header.findIndex(x => String(x).trim() === 'Долгота');
  const cAddr = header.findIndex(x => String(x).trim() === 'Описание');
  if (cLat < 0 || cLng < 0) throw new Error('Нет «Широта»/«Долгота»');
  if (cAddr < 0) throw new Error('Нет «Описание»');
  let added = 0, skipped = 0;
  for (let i = h + 1; i < rows.length; i++){
    const r = rows[i]; if (!r) continue;
    const lat = parseFloat(String(r[cLat]).replace(',', '.'));
    const lng = parseFloat(String(r[cLng]).replace(',', '.'));
    const addr = r[cAddr];
    if (!addr || isNaN(lat) || isNaN(lng)){ skipped++; continue; }
    out.set(gponNormAddr(addr), { lat, lng, address: addr });
    added++;
  }
  return { added, skipped };
}

function gponParseVgroups(text){
  const first = text.split(/\r?\n/)[0] || '';
  const delim = gponDetectDelim(first);
  const rows = gponParseCSV(text, delim);
  if (!rows.length) return { matched:0, unmatched:0, total:0 };
  const header = rows[0].map(h => (h||'').replace(/^"|"$/g,'').trim());
  let iLogin = header.indexOf('Логин');
  if (iLogin < 0){
    const probe = rows[1] || [];
    for (let i = 0; i < probe.length; i++) if ((probe[i]||'').includes('/')){ iLogin = i; break; }
  }
  if (iLogin < 0) iLogin = 1;
  const iID = header.indexOf('ID') >= 0 ? header.indexOf('ID') : 0;
  const iAddr = header.indexOf('Адрес') >= 0 ? header.indexOf('Адрес') : 8;
  const iStat = header.findIndex(h => h.startsWith('Блокировка'));

  const onus = [], byBranch = new Map();
  let matched = 0, unmatched = 0;
  for (let i = 1; i < rows.length; i++){
    const r = rows[i]; if (!r) continue;
    const login = (r[iLogin]||'').trim();
    const addr = (r[iAddr]||'').trim();
    if (!login || !addr || login === 'null' || addr === 'null') continue;
    const g = G.geo.get(gponNormAddr(addr));
    const status = iStat >= 0 ? (r[iStat]||'').trim() : '';
    const o = {
      id: (r[iID]||'').trim(),
      login, address: addr, status,
      branch: gponBranch(login),
      lat: g ? g.lat : null,
      lng: g ? g.lng : null,
      _statusKey: gponStatusKey(status),
    };
    onus.push(o);
    if (!byBranch.has(o.branch)) byBranch.set(o.branch, []);
    byBranch.get(o.branch).push(o);
    if (g) matched++; else unmatched++;
  }
  G.onus = onus;
  G.byBranch = byBranch;
  return { matched, unmatched, total: onus.length };
}

function gponBuildBranchFilter(){
  const el = $('filter-branch-list');
  const tree = new Map();
  for (const [branch, onus] of G.byBranch){
    const g = gponBranchGroup(branch);
    const s = gponBranchSubgroup(branch);
    const ss = gponBranchSubsub(branch);
    if (!tree.has(g)) tree.set(g, new Map());
    const sg = tree.get(g);
    if (!sg.has(s)) sg.set(s, new Map());
    const ssg = sg.get(s);
    if (!ssg.has(ss)) ssg.set(ss, []);
    ssg.get(ss).push({ branch, cnt: onus.length });
  }
  const RANK = { 'slav*':0, 'bdcom-*':1, '— Прочие':2 };
  const sorted = [...tree.keys()].sort((a,b) => (RANK[a] ?? 3) - (RANK[b] ?? 3) || a.localeCompare(b,'ru'));

  const frag = document.createDocumentFragment();
  for (const gname of sorted){
    const subs = tree.get(gname);
    let gB = 0, gO = 0;
    subs.forEach(ssMap => ssMap.forEach(arr => { gB += arr.length; arr.forEach(({cnt}) => gO += cnt); }));
    const gEl = document.createElement('div');
    gEl.className = 'branch-group';
    gEl.innerHTML = `<label class="branch-group-head">
      <input type="checkbox" class="group-check" data-group="${esc(gname)}">
      <span class="toggle-g">▸</span>
      <span class="g-name">${esc(gname)}</span>
      <span class="g-cnt">${gB} / ${gO}</span></label>`;
    const gList = document.createElement('div');
    gList.className = 'branch-group-list';

    const sortedSubs = [...subs.keys()].sort((a,b) => a.localeCompare(b,'ru'));
    for (const sname of sortedSubs){
      const ssMap = subs.get(sname);
      let sB = 0, sO = 0;
      ssMap.forEach(arr => { sB += arr.length; arr.forEach(({cnt}) => sO += cnt); });
      const sEl = document.createElement('div');
      sEl.className = 'branch-subgroup';
      sEl.innerHTML = `<label class="branch-subgroup-head">
        <input type="checkbox" class="subgroup-check" data-subgroup="${esc(sname)}">
        <span class="toggle-s">▸</span>
        <span class="s-name">${esc(sname)}</span>
        <span class="s-cnt">${sB} / ${sO}</span></label>`;
      const sList = document.createElement('div');
      sList.className = 'branch-subgroup-list';

      const sortedSS = [...ssMap.keys()].sort((a,b) => a.localeCompare(b,'ru'));
      for (const ssname of sortedSS){
        const items = ssMap.get(ssname);
        if (ssname === ''){
          for (const {branch, cnt} of items){
            const l = document.createElement('label');
            l.className = 'filter-item';
            l.dataset.branch = branch.toLowerCase();
            l.innerHTML = `<input type="checkbox" data-filter="branch" value="${esc(branch)}">
              <span class="name">${esc(branch)}</span><span class="cnt">${cnt}</span>`;
            sList.appendChild(l);
          }
          continue;
        }
        const ss = document.createElement('div');
        ss.className = 'branch-subsub';
        let ssO = 0;
        for (const {cnt} of items) ssO += cnt;
        ss.innerHTML = `<label class="branch-subsub-head">
          <input type="checkbox" class="subsub-check" data-subsub="${esc(ssname)}">
          <span class="toggle-ss">▸</span>
          <span class="ss-name">${esc(ssname)}</span>
          <span class="ss-cnt">${items.length} / ${ssO}</span></label>`;
        const ssList = document.createElement('div');
        ssList.className = 'branch-subsub-list';
        for (const {branch, cnt} of items){
          const l = document.createElement('label');
          l.className = 'filter-item';
          l.dataset.branch = branch.toLowerCase();
          l.innerHTML = `<input type="checkbox" data-filter="branch" value="${esc(branch)}">
            <span class="name">${esc(branch)}</span><span class="cnt">${cnt}</span>`;
          ssList.appendChild(l);
        }
        ss.appendChild(ssList);
        sList.appendChild(ss);
      }
      sEl.appendChild(sList);
      gList.appendChild(sEl);
    }
    gEl.appendChild(gList);
    frag.appendChild(gEl);
  }
  el.replaceChildren(frag);

  el.addEventListener('click', gponFilterClick);
  el.addEventListener('change', gponFilterChange);
  gponSyncChecks();

  gponHighlightLinkedBranches();
}

function gponBranchGroup(b){
  if (!b) return '— Прочие';
  if (b.charCodeAt(0) === 45) return '— Прочие';
  const l = b.toLowerCase();
  if (l.startsWith('bdcom')) return 'bdcom-*';
  if (l.startsWith('slav')) return 'slav*';
  return '— Прочие';
}
function gponBranchSubgroup(b){
  if (!b) return '—';
  const i = b.indexOf('/');
  return i <= 0 ? b : b.slice(0, i);
}
function gponBranchSubsub(b){
  if (!b) return '';
  const f = b.indexOf('/'), l = b.lastIndexOf('/');
  return (f <= 0 || l <= f) ? '' : b.slice(0, l);
}

function gponFilterClick(e){
  const head = e.target.closest('.branch-group-head, .branch-subgroup-head, .branch-subsub-head');
  if (!head) return;
  const t = e.target;
  if (!t.classList.contains('toggle-g') && !t.classList.contains('toggle-s') && !t.classList.contains('toggle-ss')) return;
  e.preventDefault(); e.stopPropagation();
  const block = head.parentElement;
  block.classList.toggle('collapsed');
  const tt = head.querySelector('.toggle-g, .toggle-s, .toggle-ss');
  if (tt) tt.textContent = block.classList.contains('collapsed') ? '▸' : '▾';
}

function gponFilterChange(e){
  const t = e.target;
  if (!(t instanceof HTMLInputElement)) return;

  gponClearBranchHighlight();

  if (t.matches('input[data-filter="branch"]')){
    const set = G.filters.branch;
    if (t.checked) set.add(t.value); else set.delete(t.value);
    gponApplyKmzLinkFilter(); gponSyncChecks();
    return;
  }
  if (t.matches('input[data-filter="status"]')){
    const set = G.filters.status;
    if (t.checked) set.add(t.value); else set.delete(t.value);
    gponApplyKmzLinkFilter();
    return;
  }
  const box = t.closest('.group-check, .subgroup-check, .subsub-check');
  if (!box) return;
  const container = box.closest('.branch-group, .branch-subgroup, .branch-subsub');
  if (!container) return;
  const set = G.filters.branch;
  const checks = container.querySelectorAll('input[data-filter="branch"]');
  for (const c of checks){
    c.checked = box.checked;
    if (box.checked) set.add(c.value); else set.delete(c.value);
  }
  gponApplyKmzLinkFilter(); gponSyncChecks();
}

function gponSyncChecks(){
  const root = $('filter-branch-list');
  for (const group of root.querySelectorAll('.branch-group')){
    const gBox = group.querySelector('.group-check');
    const gCh = group.querySelectorAll('input[data-filter="branch"]');
    let ch = 0;
    for (const c of gCh) if (c.checked) ch++;
    if (gBox){ gBox.checked = ch === gCh.length && gCh.length > 0; gBox.indeterminate = ch > 0 && ch < gCh.length; }

    for (const sub of group.querySelectorAll('.branch-subgroup')){
      const sBox = sub.querySelector('.subgroup-check');
      const sCh = sub.querySelectorAll('input[data-filter="branch"]');
      let sc = 0;
      for (const c of sCh) if (c.checked) sc++;
      if (sBox){ sBox.checked = sc === sCh.length && sCh.length > 0; sBox.indeterminate = sc > 0 && sc < sCh.length; }

      for (const ss of sub.querySelectorAll('.branch-subsub')){
        const ssBox = ss.querySelector('.subsub-check');
        const ssCh = ss.querySelectorAll('input[data-filter="branch"]');
        let ssc = 0;
        for (const c of ssCh) if (c.checked) ssc++;
        if (ssBox){ ssBox.checked = ssc === ssCh.length && ssCh.length > 0; ssBox.indeterminate = ssc > 0 && ssc < ssCh.length; }
      }
    }
  }
}

function gponSearch(q){
  const root = $('filter-branch-list');
  for (const group of root.querySelectorAll('.branch-group')){
    let anyV = false;
    for (const sub of group.querySelectorAll('.branch-subgroup')){
      let subV = false;
      for (const ss of sub.querySelectorAll('.branch-subsub')){
        let ssV = false;
        for (const el of ss.querySelectorAll('.filter-item')){
          const show = !q || el.dataset.branch.includes(q);
          el.style.display = show ? '' : 'none';
          if (show){ anyV = subV = ssV = true; }
        }
        ss.style.display = ssV ? '' : 'none';
      }
      for (const el of sub.querySelectorAll(':scope > .branch-subgroup-list > .filter-item')){
        const show = !q || el.dataset.branch.includes(q);
        el.style.display = show ? '' : 'none';
        if (show){ anyV = subV = true; }
      }
      sub.style.display = subV ? '' : 'none';
    }
    group.style.display = anyV ? '' : 'none';
  }

  if (G.searchHighlightLayer){
    map.removeLayer(G.searchHighlightLayer);
    G.searchHighlightLayer = null;
  }
  if (!q){
    G.searchMode = false;
    gponApplyKmzLinkFilter();
    $('s-found').textContent = '—';
    return;
  }

  const hits = [];
  for (const o of G.onus){
    if (o.lat == null) continue;
    if ((o.id + ' ' + o.login + ' ' + o.address + ' ' + o.status + ' ' + o.branch).toLowerCase().includes(q))
      hits.push(o);
  }
  G.searchMode = true;
  for (const k in G.branchLayers) if (map.hasLayer(G.branchLayers[k])) map.removeLayer(G.branchLayers[k]);

  const layer = L.layerGroup();
  for (const o of hits){
    const c = L.circleMarker([o.lat, o.lng], {
      radius:14, color:'#38bdf8', weight:3,
      fillColor:'#38bdf8', fillOpacity:.15,
    });
    c.__onu = o;
    gponBindPopup(c);
    c.addTo(layer);
  }
  layer.addTo(map);
  G.searchHighlightLayer = layer;
  if (hits.length) map.setView([hits[0].lat, hits[0].lng], Math.max(map.getZoom(), 15));
  $('s-found').textContent = hits.length;
}
