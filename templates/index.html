<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>KMZ Routes Viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #ffffff;
    --panel: #f5f6f8;
    --border: #d8dbe0;
    --text: #1c1e21;
    --muted: #6b7280;
    --accent: #468cff;
    --hover: #e9eefb;
  }
  body.dark {
    --bg: #1b1d21;
    --panel: #24272c;
    --border: #34383f;
    --text: #e6e8eb;
    --muted: #9aa1ab;
    --accent: #6aa1ff;
    --hover: #2e3440;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); overflow: hidden; }

  #app { display: flex; height: 100vh; }

  #sidebar {
    width: 380px; min-width: 260px; max-width: 640px;
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; resize: horizontal; overflow: hidden;
  }

  #toolbar {
    padding: 8px; display: flex; flex-wrap: wrap; gap: 6px;
    border-bottom: 1px solid var(--border);
  }
  #toolbar button {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer;
  }
  #toolbar button:hover { background: var(--hover); }

  #searchWrap { padding: 6px 8px; border-bottom: 1px solid var(--border); }
  #search {
    width: 100%; padding: 6px 8px; font-size: 13px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
  }

  #mergeControls {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 8px;
    border-bottom: 1px solid var(--border); align-items: center;
  }
  #mergeControls input {
    flex: 1; min-width: 120px; padding: 4px 6px; font-size: 12px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
  }
  #mergeControls button {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer;
  }
  #mergeControls button:hover { background: var(--hover); }

  #pane-tree { flex: 1; overflow: auto; padding: 8px; }

  /* ---------- Folder tree ---------- */
  .folder-row {
    display: flex; align-items: center; gap: 4px;
    padding: 3px 6px; border-radius: 4px; font-size: 13px;
    user-select: none; cursor: pointer;
  }
  .folder-row:hover { background: var(--hover); }
  .folder-row.drop-target {
    background: rgba(70,140,255,.25);
    outline: 1px dashed var(--accent);
  }
  .folder-toggle {
    width: 12px; color: var(--muted); font-size: 10px;
    text-align: center; cursor: pointer;
  }
  .folder-cb { margin: 0; cursor: pointer; accent-color: var(--accent); }
  .folder-name {
    font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .folder-count { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .folder-actions { display: none; margin-left: auto; gap: 2px; }
  .folder-row:hover .folder-actions { display: inline-flex; }
  .folder-actions button {
    background: none; border: none; color: var(--text);
    cursor: pointer; padding: 0 3px; opacity: .75; font-size: 12px;
  }
  .folder-actions button:hover { opacity: 1; }
  .folder-children { margin-left: 14px; }
  .folder-children.collapsed { display: none; }

  /* ---------- Route row ---------- */
  .route-row {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 6px; border-radius: 4px; font-size: 13px;
    user-select: none;
  }
  .route-row:hover { background: var(--hover); }
  .route-row.dragging { opacity: .5; }
  .route-row input[type=checkbox] { margin: 0; cursor: pointer; accent-color: var(--accent); }
  .route-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .route-actions { display: none; gap: 2px; }
  .route-row:hover .route-actions { display: inline-flex; }
  .route-actions button {
    background: none; border: none; color: var(--text);
    cursor: pointer; padding: 0 3px; opacity: .7; font-size: 12px;
  }
  .route-actions button:hover { opacity: 1; }
  .route-row.merge-marked { background: rgba(70,140,255,.15); }

  /* ---------- Map ---------- */
  #mapWrap { flex: 1; position: relative; }
  #map { width: 100%; height: 100%; background: var(--panel); }
  body.dark #map { background: #1b1d21; }

  #isolationBadge {
    position: absolute; top: 10px; left: 50px; z-index: 500;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 4px 8px; border-radius: 4px;
    font-size: 12px; display: none; align-items: center; gap: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  #isolationBadge button {
    background: none; border: none; color: var(--text);
    cursor: pointer; font-size: 14px; line-height: 1;
  }

  #dropHint {
    position: fixed; inset: 0; pointer-events: none; z-index: 9999;
    background: rgba(70,140,255,.15);
    border: 3px dashed var(--accent);
    display: none; align-items: center; justify-content: center;
    font-size: 22px; color: var(--accent); font-weight: 600;
  }
  #dropHint.visible { display: flex; }

  /* Тёмная тема для контрола слоёв Leaflet */
  body.dark .leaflet-control-layers {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border);
  }
  body.dark .leaflet-control-layers label { color: var(--text); }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="toolbar">
      <button id="btnUploadFiles">📂 Загрузить KMZ</button>
      <button id="btnUploadFolder">📁 Загрузить папку</button>
      <button id="btnNewFolder">📁+ Папка</button>
      <button id="btnExport">💾 Скачать KMZ</button>
      <button id="btnTheme">🌓 Тема</button>
      <input type="file" id="fileInput" multiple accept=".kmz,.kml" style="display:none">
      <input type="file" id="folderInput" webkitdirectory multiple style="display:none">
    </div>

    <div id="searchWrap">
      <input id="search" type="text" placeholder="Поиск по имени, файлу, ветке, папке…">
    </div>

    <div id="mergeControls">
      <input id="newBranchName" placeholder="Название новой ветви">
      <button id="btnMerge">🚂 Объединить выбранные</button>
      <button id="btnReplace">🔄 Замена</button>
    </div>

    <div id="pane-tree">
      <div id="folderTree"></div>
    </div>
  </aside>

  <div id="mapWrap">
    <div id="map"></div>
    <div id="isolationBadge">
      <span id="isolationText"></span>
      <button id="btnClearIsolation" title="Снять изоляцию">✕</button>
    </div>
  </div>
</div>

<div id="dropHint">Отпустите файлы или папки для загрузки</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============================ State ============================ */
const State = {
  routes: [],
  layers: new Map(),
  hiddenBranches: new Set(),
  search: '',
  mergeMarked: new Set(),
  isolation: null,
  customFolders: new Set(),
  dragPayload: null,
  debounceTimer: null,
};

const map = L.map('map', { preferCanvas: true }).setView([55.75, 37.62], 6);

/* ---------- Подложки: только стабильные, без API-ключей ---------- */
const basemaps = {
  'OSM DE': L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap',
  }),
  'Esri Улицы': L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: '© Esri' }
  ),
  'Esri Спутник': L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: '© Esri' }
  ),
  'Esri Топо': L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: '© Esri' }
  ),
  'Carto Светлая': L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    { maxZoom: 19, subdomains: 'abcd', attribution: '© CARTO' }
  ),
  'Carto Тёмная': L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    { maxZoom: 19, subdomains: 'abcd', attribution: '© CARTO' }
  ),
};

/* Прозрачный 1×1 пиксель для битых тайлов — вместо «дырок» */
const TRANSPARENT_TILE =
  'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkAAIAAAoAAv/lxKUAAAAASUVORK5CYII=';
Object.values(basemaps).forEach(layer => {
  layer.options.errorTileUrl = TRANSPARENT_TILE;
});

/* Дефолтная подложка — самое стабильное немецкое зеркало */
basemaps['OSM DE'].addTo(map);
L.control.layers(basemaps, null, { position: 'topright', collapsed: false }).addTo(map);

let searchHighlightLayer = L.layerGroup().addTo(map);

/* ============================ Helpers ============================ */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function stringToColor(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  const hue = Math.abs(h) % 360;
  return `hsl(${hue}, 70%, 45%)`;
}

function simplify(points, minDist = 3) {
  if (points.length < 3) return points;
  const out = [points[0]];
  const R = 6371000, toRad = Math.PI / 180;
  let lastLat = points[0][0], lastLon = points[0][1];
  for (let i = 1; i < points.length - 1; i++) {
    const [lat, lon] = points[i];
    const dLat = (lat - lastLat) * toRad;
    const dLon = (lon - lastLon) * toRad;
    const a = Math.sin(dLat/2)**2 +
              Math.cos(lastLat*toRad) * Math.cos(lat*toRad) * Math.sin(dLon/2)**2;
    const d = 2 * R * Math.asin(Math.sqrt(a));
    if (d >= minDist) { out.push([lat, lon]); lastLat = lat; lastLon = lon; }
  }
  out.push(points[points.length - 1]);
  return out;
}

function debounce(fn, ms) {
  return (...args) => {
    clearTimeout(State.debounceTimer);
    State.debounceTimer = setTimeout(() => fn(...args), ms);
  };
}

function patchRoute(id, patch) {
  return fetch(`/route/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(patch),
  }).catch(err => console.error('PATCH failed', id, err));
}

/* ============================ Loading ============================ */
async function loadRoutes() {
  const res = await fetch('/routes');
  State.routes = await res.json();
  renderAll();
}

/* ============================ Map layers ============================ */
/**
 * Строит слой маршрута: белая halo-подложка + цветная линия.
 * halo делает маршрут видимым на любой подложке (светлая/тёмная/спутник).
 */
function buildLayer(r) {
  const pts = simplify(r.points.map(p => [p[0], p[1]]));
  const color = stringToColor(r.branch || r.name);

  const halo = L.polyline(pts, {
    color: '#ffffff',
    weight: 7,
    opacity: 0.75,
    lineCap: 'round',
    lineJoin: 'round',
    interactive: false,
  });

  const line = L.polyline(pts, {
    color,
    weight: 3.5,
    opacity: 0.95,
    lineCap: 'round',
    lineJoin: 'round',
  });

  const group = L.layerGroup([halo, line]);

  group.on('click', (e) => {
    L.DomEvent.stopPropagation(e);
    isolateByRoute(r);
  });
  group.bindTooltip(r.name, { sticky: true });

  return group;
}

function rebuildLayers() {
  for (const [id, layer] of State.layers) map.removeLayer(layer);
  State.layers.clear();
  for (const r of State.routes) {
    const layer = buildLayer(r);
    State.layers.set(r.id, layer);
    layer.addTo(map);
  }
  applyFilters();
  fitAll();
}

function fitAll() {
  const all = [];
  for (const layer of State.layers.values()) {
    // layerGroup: берём координаты из первой полилинии
    const layers = layer.getLayers ? layer.getLayers() : [layer];
    for (const l of layers) {
      if (l.getLatLngs) {
        try { all.push(...l.getLatLngs()); } catch (e) {}
      }
    }
  }
  if (all.length) {
    try { map.fitBounds(L.latLngBounds(all), { padding: [30, 30] }); } catch (e) {}
  }
}

/* ============================ Filters ============================ */
function applyFilters() {
  const q = State.search.toLowerCase();

  for (const r of State.routes) {
    const layer = State.layers.get(r.id);
    if (!layer) continue;

    let visible = r.visible;
    if (r.branch && State.hiddenBranches.has(r.branch)) visible = false;

    if (q) {
      const hay = `${r.name} ${r.branch || ''} ${r.folder || ''}`.toLowerCase();
      if (!hay.includes(q)) visible = false;
    }

    if (State.isolation) {
      if (State.isolation.type === 'branch') {
        if ((r.branch || '__none__') !== State.isolation.key) visible = false;
      } else {
        if (r.id !== State.isolation.key) visible = false;
      }
    }

    if (visible) {
      if (!map.hasLayer(layer)) layer.addTo(map);
    } else {
      if (map.hasLayer(layer)) map.removeLayer(layer);
    }
  }
}

/* ============================ Isolation ============================ */
function isolateByRoute(r) {
  const key = r.branch || '__none__';
  if (State.isolation && State.isolation.key === key &&
      State.isolation.type === (r.branch ? 'branch' : 'route')) {
    clearIsolation();
    return;
  }
  State.isolation = { type: r.branch ? 'branch' : 'route', key: r.branch ? key : r.id };
  applyFilters();
  updateIsolationBadge();

  const layer = State.layers.get(r.id);
  if (layer && r.points.length) {
    const bounds = L.latLngBounds(r.points.map(p => [p[0], p[1]]));
    try { map.fitBounds(bounds, { padding: [40, 40] }); } catch (e) {}
  }
}

function clearIsolation() {
  State.isolation = null;
  applyFilters();
  updateIsolationBadge();
}

function updateIsolationBadge() {
  const badge = document.getElementById('isolationBadge');
  const text = document.getElementById('isolationText');
  if (!State.isolation) { badge.style.display = 'none'; return; }
  badge.style.display = 'flex';
  if (State.isolation.type === 'branch') {
    text.textContent = `Изоляция ветви: ${State.isolation.key}`;
  } else {
    const r = State.routes.find(x => x.id === State.isolation.key);
    text.textContent = `Изоляция маршрута: ${r ? r.name : ''}`;
  }
}
map.on('click', () => { if (State.isolation) clearIsolation(); });
document.getElementById('btnClearIsolation').onclick = clearIsolation;

/* ============================ Folder tree ============================ */
function buildFolderTree() {
  const root = { name: '', children: new Map(), routes: [] };
  function ensure(parts) {
    let node = root;
    for (const part of parts) {
      if (!part) continue;
      if (!node.children.has(part)) {
        node.children.set(part, { name: part, children: new Map(), routes: [] });
      }
      node = node.children.get(part);
    }
    return node;
  }
  for (const r of State.routes) {
    ensure((r.folder || '').split('/').filter(Boolean)).routes.push(r);
  }
  for (const path of State.customFolders) {
    ensure(path.split('/').filter(Boolean));
  }
  return root;
}

function collectRoutesInNode(node) {
  const out = [...node.routes];
  for (const child of node.children.values()) {
    out.push(...collectRoutesInNode(child));
  }
  return out;
}

function renderFolderTree() {
  const container = document.getElementById('folderTree');
  container.innerHTML = '';
  const root = buildFolderTree();
  renderFolderNode(root, container, [], true);
}

function renderFolderNode(node, container, pathParts, isRoot) {
  const currentPath = isRoot ? [] : [...pathParts, node.name];
  const pathStr = currentPath.join('/');

  if (!isRoot && node.name) {
    const row = document.createElement('div');
    row.className = 'folder-row';
    row.dataset.folderPath = pathStr;
    row.draggable = true;

    const routesInNode = collectRoutesInNode(node);
    const total = routesInNode.length;
    let visibleCount = 0;
    for (const r of routesInNode) {
      const hiddenByBranch = r.branch && State.hiddenBranches.has(r.branch);
      if (r.visible && !hiddenByBranch) visibleCount++;
    }

    row.addEventListener('dragover', onFolderDragOver);
    row.addEventListener('dragleave', onFolderDragLeave);
    row.addEventListener('drop', onFolderDrop);
    row.addEventListener('dragstart', (e) => {
      State.dragPayload = { type: 'folder', path: pathStr };
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', node.name);
    });
    row.addEventListener('dragend', () => { State.dragPayload = null; });

    const toggle = document.createElement('span');
    toggle.className = 'folder-toggle';
    toggle.textContent = '▾';
    toggle.onclick = (e) => {
      e.stopPropagation();
      const children = row.nextElementSibling;
      if (children && children.classList.contains('folder-children')) {
        children.classList.toggle('collapsed');
        toggle.textContent = children.classList.contains('collapsed') ? '▸' : '▾';
      }
    };

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'folder-cb';
    cb.checked = total > 0 && visibleCount === total;
    cb.indeterminate = visibleCount > 0 && visibleCount < total;
    cb.disabled = total === 0;
    cb.title = `${visibleCount} из ${total} видимо`;
    cb.addEventListener('click', (e) => e.stopPropagation());
    cb.addEventListener('change', (e) => {
      e.stopPropagation();
      const allOn = cb.checked && !cb.indeterminate;
      setFolderVisible(node, !allOn);
    });

    const nameSpan = document.createElement('span');
    nameSpan.className = 'folder-name';
    nameSpan.textContent = node.name;
    nameSpan.title = `${node.name} — ${visibleCount}/${total}`;
    nameSpan.addEventListener('click', (e) => { e.stopPropagation(); toggle.onclick(e); });

    const cnt = document.createElement('span');
    cnt.className = 'folder-count';
    cnt.textContent = total ? `${visibleCount}/${total}` : '';

    const actions = document.createElement('span');
    actions.className = 'folder-actions';
    actions.innerHTML = `
      <button data-act="show-all"  title="Показать всё">☑</button>
      <button data-act="hide-all"  title="Скрыть всё">☐</button>
      <button data-act="rename-folder" title="Переименовать">✏️</button>
      <button data-act="new-subfolder" title="Создать подпапку">📁+</button>
      <button data-act="delete-folder" title="Удалить папку">🗑</button>
    `;
    actions.querySelector('[data-act="show-all"]').onclick = (e) => {
      e.stopPropagation(); setFolderVisible(node, true);
    };
    actions.querySelector('[data-act="hide-all"]').onclick = (e) => {
      e.stopPropagation(); setFolderVisible(node, false);
    };
    actions.querySelector('[data-act="rename-folder"]').onclick = (e) => {
      e.stopPropagation(); renameFolder(pathStr);
    };
    actions.querySelector('[data-act="new-subfolder"]').onclick = (e) => {
      e.stopPropagation();
      const sub = prompt('Имя подпапки:');
      if (!sub) return;
      State.customFolders.add(`${pathStr}/${sub.trim()}`);
      renderFolderTree();
    };
    actions.querySelector('[data-act="delete-folder"]').onclick = (e) => {
      e.stopPropagation(); deleteFolder(pathStr);
    };

    row.appendChild(toggle);
    row.appendChild(cb);
    row.appendChild(nameSpan);
    row.appendChild(cnt);
    row.appendChild(actions);

    container.appendChild(row);

    const childWrap = document.createElement('div');
    childWrap.className = 'folder-children';
    container.appendChild(childWrap);
    container = childWrap;
  }

  for (const child of node.children.values()) {
    renderFolderNode(child, container, currentPath, false);
  }
  for (const r of node.routes) {
    container.appendChild(buildRouteLi(r));
  }
}

function buildRouteLi(r) {
  const li = document.createElement('div');
  li.className = 'route-row';
  li.dataset.id = r.id;
  li.draggable = true;

  li.addEventListener('dragstart', (e) => {
    State.dragPayload = { type: 'route', id: r.id, from: r.folder || '' };
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', r.name);
    li.classList.add('dragging');
  });
  li.addEventListener('dragend', () => {
    State.dragPayload = null;
    li.classList.remove('dragging');
    document.querySelectorAll('.folder-row.drop-target')
      .forEach(el => el.classList.remove('drop-target'));
  });

  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = r.visible;
  cb.onchange = async () => {
    r.visible = cb.checked;
    await patchRoute(r.id, { visible: r.visible });
    applyFilters();
    renderFolderTree();
  };
  li.appendChild(cb);

  const nameSpan = document.createElement('span');
  nameSpan.className = 'route-name';
  nameSpan.textContent = r.name;
  nameSpan.title = `${r.name}${r.branch ? ' — ' + r.branch : ''}`;
  li.appendChild(nameSpan);

  const actions = document.createElement('span');
  actions.className = 'route-actions';
  actions.innerHTML = `
    <button data-act="rename" title="Переименовать">✏️</button>
    <button data-act="merge" title="Отметить для объединения">${State.mergeMarked.has(r.id) ? '☑' : '◻'}</button>
    <button data-act="delete" title="Удалить">✕</button>
  `;
  actions.querySelector('[data-act="rename"]').onclick = async () => {
    const nn = prompt('Новое имя:', r.name);
    if (!nn) return;
    r.name = nn;
    await patchRoute(r.id, { name: nn });
    renderAll();
  };
  actions.querySelector('[data-act="merge"]').onclick = () => {
    if (State.mergeMarked.has(r.id)) State.mergeMarked.delete(r.id);
    else State.mergeMarked.add(r.id);
    renderFolderTree();
  };
  actions.querySelector('[data-act="delete"]').onclick = async () => {
    if (!confirm(`Удалить "${r.name}"?`)) return;
    await fetch(`/route/${r.id}`, { method: 'DELETE' });
    State.routes = State.routes.filter(x => x.id !== r.id);
    const l = State.layers.get(r.id);
    if (l) map.removeLayer(l);
    State.layers.delete(r.id);
    renderAll();
  };
  li.appendChild(actions);

  if (State.mergeMarked.has(r.id)) li.classList.add('merge-marked');
  return li;
}

/* Root drop zone */
const treeRootEl = document.getElementById('folderTree');
treeRootEl.addEventListener('dragover', (e) => {
  if (!State.dragPayload) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
});
treeRootEl.addEventListener('drop', (e) => {
  if (e.target !== treeRootEl) return;
  e.currentTarget.dataset.folderPath = '';
  onFolderDrop(e);
});

/* ============================ Folder DnD ============================ */
function onFolderDragOver(e) {
  if (!State.dragPayload) return;
  e.preventDefault();
  e.stopPropagation();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drop-target');
}
function onFolderDragLeave(e) {
  e.currentTarget.classList.remove('drop-target');
}
async function onFolderDrop(e) {
  e.preventDefault();
  e.stopPropagation();
  e.currentTarget.classList.remove('drop-target');
  const payload = State.dragPayload;
  if (!payload) return;
  const targetFolder = e.currentTarget.dataset.folderPath || '';

  if (payload.type === 'route') {
    await moveRoutesToFolder([payload.id], targetFolder);
  } else if (payload.type === 'branch') {
    const ids = State.routes
      .filter(r => (r.branch || '__none__') === payload.key)
      .map(r => r.id);
    await moveRoutesToFolder(ids, targetFolder);
  } else if (payload.type === 'folder') {
    await moveFolder(payload.path, targetFolder);
  }
  State.dragPayload = null;
}

async function moveRoutesToFolder(ids, folder) {
  const affected = State.routes.filter(r => ids.includes(r.id));
  if (!affected.length) return;
  for (const r of affected) r.folder = folder;
  State.customFolders.delete(folder);
  renderAll();
  await Promise.all(affected.map(r => patchRoute(r.id, { folder })));
}

async function moveFolder(srcPath, dstParent) {
  if (!srcPath) return;
  if (dstParent === srcPath || dstParent.startsWith(srcPath + '/')) return;
  const baseName = srcPath.split('/').pop();
  const newPath = dstParent ? `${dstParent}/${baseName}` : baseName;
  if (newPath === srcPath) return;

  const affected = State.routes.filter(r =>
    r.folder === srcPath || (r.folder || '').startsWith(srcPath + '/')
  );
  for (const r of affected) {
    r.folder = newPath + (r.folder || '').slice(srcPath.length);
  }
  const updated = new Set();
  for (const f of State.customFolders) {
    if (f === srcPath) updated.add(newPath);
    else if (f.startsWith(srcPath + '/')) updated.add(newPath + f.slice(srcPath.length));
    else updated.add(f);
  }
  State.customFolders = updated;
  renderAll();
  await Promise.all(affected.map(r => patchRoute(r.id, { folder: r.folder })));
}

async function renameFolder(oldPath) {
  const cur = oldPath.split('/').pop();
  const newName = prompt('Новое имя папки:', cur);
  if (!newName || newName === cur) return;
  const parent = oldPath.split('/').slice(0, -1).join('/');
  const newPath = parent ? `${parent}/${newName.trim()}` : newName.trim();

  const affected = State.routes.filter(r =>
    r.folder === oldPath || (r.folder || '').startsWith(oldPath + '/')
  );
  for (const r of affected) {
    r.folder = newPath + (r.folder || '').slice(oldPath.length);
  }
  const updated = new Set();
  for (const f of State.customFolders) {
    if (f === oldPath) updated.add(newPath);
    else if (f.startsWith(oldPath + '/')) updated.add(newPath + f.slice(oldPath.length));
    else updated.add(f);
  }
  State.customFolders = updated;
  renderAll();
  await Promise.all(affected.map(r => patchRoute(r.id, { folder: r.folder })));
}

async function deleteFolder(path) {
  const affected = State.routes.filter(r =>
    r.folder === path || (r.folder || '').startsWith(path + '/')
  );
  if (affected.length && !confirm(
    `В папке "${path}" есть ${affected.length} маршрут(ов). Переместить их в корень?`
  )) return;

  for (const r of affected) r.folder = '';
  State.customFolders.delete(path);
  for (const f of [...State.customFolders]) {
    if (f.startsWith(path + '/')) State.customFolders.delete(f);
  }
  renderAll();
  await Promise.all(affected.map(r => patchRoute(r.id, { folder: '' })));
}

/* ============================ Folder visibility ============================ */
function setFolderVisible(node, visible) {
  const routes = collectRoutesInNode(node);
  if (!routes.length) return;

  for (const r of routes) {
    r.visible = visible;
    if (r.branch) {
      if (visible) State.hiddenBranches.delete(r.branch);
      else State.hiddenBranches.add(r.branch);
    }
  }
  applyFilters();
  renderFolderTree();
  Promise.all(routes.map(r => patchRoute(r.id, { visible: r.visible })))
    .catch(err => console.error('batch visible failed', err));
}

/* ============================ Search ============================ */
const searchInput = document.getElementById('search');
searchInput.addEventListener('input', debounce(() => {
  State.search = searchInput.value.trim();
  applyFilters();
}, 180));

/* ============================ Toolbar ============================ */
document.getElementById('btnUploadFiles').onclick = () => {
  document.getElementById('fileInput').click();
};
document.getElementById('btnUploadFolder').onclick = () => {
  document.getElementById('folderInput').click();
};
document.getElementById('fileInput').onchange = (e) => uploadFiles([...e.target.files]);
document.getElementById('folderInput').onchange = (e) => uploadFiles([...e.target.files]);

document.getElementById('btnNewFolder').onclick = () => {
  const name = prompt('Название новой папки (можно через / для вложенности):');
  if (!name) return;
  const clean = name.trim().replace(/^\/+|\/+$/g, '');
  if (!clean) return;
  State.customFolders.add(clean);
  renderFolderTree();
};

document.getElementById('btnExport').onclick = async () => {
  const visibleIds = State.routes
    .filter(r => {
      const layer = State.layers.get(r.id);
      return layer && map.hasLayer(layer);
    })
    .map(r => r.id);
  if (!visibleIds.length) { alert('Нет видимых маршрутов для экспорта'); return; }
  const groupByBranch = confirm('Группировать по ветвям? OK — да, Отмена — нет.');
  const res = await fetch('/export', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ids: visibleIds, group_by_branch: groupByBranch }),
  });
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'routes.kmz'; a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('btnTheme').onclick = () => {
  document.body.classList.toggle('dark');
  localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
};
if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

/* ============================ Merge / Replace ============================ */
document.getElementById('btnMerge').onclick = async () => {
  const name = document.getElementById('newBranchName').value.trim();
  if (!name) { alert('Введите название новой ветви'); return; }
  if (State.mergeMarked.size < 2) { alert('Отметьте минимум 2 маршрута'); return; }
  const res = await fetch('/merge', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ids: [...State.mergeMarked], name }),
  });
  if (!res.ok) { alert('Ошибка объединения'); return; }
  State.mergeMarked.clear();
  document.getElementById('newBranchName').value = '';
  await loadRoutes();
  rebuildLayers();
};

document.getElementById('btnReplace').onclick = async () => {
  const find = prompt('Что заменить в именах ветвей:');
  if (find === null) return;
  const repl = prompt('На что заменить:', '');
  if (repl === null) return;

  const affected = State.routes.filter(r => r.branch && r.branch.includes(find));
  for (const r of affected) {
    r.branch = r.branch.split(find).join(repl);
    r.name = r.name.split(find).join(repl);
  }
  renderAll();
  await Promise.all(affected.map(r =>
    patchRoute(r.id, { branch: r.branch, name: r.name })
  ));
};

/* ============================ Upload ============================ */
async function uploadFiles(files) {
  if (!files.length) return;
  const fd = new FormData();
  for (const f of files) {
    fd.append('files[]', f, f.name);
    fd.append('paths[]', f.webkitRelativePath || f.name);
  }
  const res = await fetch('/upload', { method: 'POST', body: fd });
  const data = await res.json();
  console.log('Uploaded:', data);
  await loadRoutes();
  rebuildLayers();
}

/* Drag&drop upload */
let dragCounter = 0;
const dropHint = document.getElementById('dropHint');

window.addEventListener('dragenter', (e) => {
  if (State.dragPayload) return;
  if (!e.dataTransfer.types.includes('Files')) return;
  dragCounter++;
  dropHint.classList.add('visible');
});
window.addEventListener('dragleave', () => {
  if (State.dragPayload) return;
  dragCounter--;
  if (dragCounter <= 0) { dropHint.classList.remove('visible'); dragCounter = 0; }
});
window.addEventListener('dragover', (e) => {
  if (e.dataTransfer.types.includes('Files')) e.preventDefault();
});
window.addEventListener('drop', async (e) => {
  if (State.dragPayload) return;
  e.preventDefault();
  dropHint.classList.remove('visible');
  dragCounter = 0;

  const items = [...(e.dataTransfer.items || [])];
  if (!items.length) {
    uploadFiles([...e.dataTransfer.files]);
    return;
  }
  const files = [];
  async function walkEntry(entry, path) {
    if (entry.isFile) {
      const file = await new Promise((res, rej) => entry.file(res, rej));
      Object.defineProperty(file, 'webkitRelativePath', { value: path + file.name });
      files.push(file);
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      const entries = await new Promise((res) => {
        const all = [];
        const read = () => reader.readEntries((batch) => {
          if (!batch.length) res(all);
          else { all.push(...batch); read(); }
        });
        read();
      });
      for (const child of entries) await walkEntry(child, path + entry.name + '/');
    }
  }
  for (const item of items) {
    const entry = item.webkitGetAsEntry && item.webkitGetAsEntry();
    if (entry) await walkEntry(entry, '');
  }
  if (files.length) uploadFiles(files);
});

/* ============================ Render / Init ============================ */
function renderAll() {
  renderFolderTree();
  applyFilters();
}

async function init() {
  await loadRoutes();
  rebuildLayers();
  console.log('routes:', State.routes.length,
              'layers:', State.layers.size,
              'onMap:', [...State.layers.values()].filter(l => map.hasLayer(l)).length);
}

init();
</script>
