<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPON: фильтр + карта</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --text:#1c1f23; --muted:#6b7280;
  --border:#e2e5ea; --accent:#2563eb; --accent-soft:#dbeafe;
  --ok:#16a34a; --off:#9ca3af; --block:#dc2626;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 6px 20px rgba(0,0,0,.06);
}
html[data-theme="dark"]{
  --bg:#12161c; --panel:#1b2129; --text:#e6e9ee; --muted:#9aa3af;
  --border:#2a323d; --accent:#60a5fa; --accent-soft:#1e3a5f;
  --ok:#22c55e; --off:#6b7280; --block:#ef4444;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--text);display:flex;flex-direction:column;
}

/* ── Шапка ───────────────────────────────────────────── */
header{
  background:var(--panel);border-bottom:1px solid var(--border);
  padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  box-shadow:var(--shadow);z-index:1000;
}
header h1{font-size:15px;margin:0 8px 0 0;font-weight:600;white-space:nowrap}
.btn{
  background:var(--accent);color:#fff;border:0;border-radius:6px;
  padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap;
  transition:filter .15s;
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--accent-soft)}
input[type=file]{display:none}

.search{
  flex:1 1 220px;min-width:180px;position:relative;
}
.search input{
  width:100%;padding:7px 10px 7px 30px;border-radius:6px;
  border:1px solid var(--border);background:var(--bg);color:var(--text);
  font-size:13px;outline:none;
}
.search input:focus{border-color:var(--accent)}
.search::before{
  content:"🔎";position:absolute;left:8px;top:50%;transform:translateY(-50%);
  font-size:12px;opacity:.7;pointer-events:none;
}

.stats{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--text);font-weight:600}
.stats .pill{
  background:var(--bg);border:1px solid var(--border);border-radius:20px;
  padding:3px 10px;display:inline-flex;gap:5px;align-items:center;
}

/* ── Основная область ────────────────────────────────── */
main{flex:1;display:flex;min-height:0;position:relative}

/* ── Панель фильтров ─────────────────────────────────── */
#panel{
  width:320px;min-width:260px;max-width:42vw;background:var(--panel);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  overflow:hidden;
}
#panel .panel-head{
  padding:10px 12px;border-bottom:1px solid var(--border);
  font-size:12px;color:var(--muted);display:flex;
  justify-content:space-between;align-items:center;gap:8px;
}
#panel .panel-head .actions{display:flex;gap:6px}
#panel .panel-head button{
  background:transparent;border:1px solid var(--border);border-radius:5px;
  color:var(--text);font-size:11px;padding:3px 7px;cursor:pointer;
}
#panel .panel-head button:hover{background:var(--accent-soft)}

.statuses{
  display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);
  flex-wrap:wrap;
}
.statuses label{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;
  background:var(--bg);border:1px solid var(--border);border-radius:20px;
  padding:3px 9px;cursor:pointer;user-select:none;
}
.statuses .dot{width:9px;height:9px;border-radius:50%}
.dot.ok{background:var(--ok)} .dot.off{background:var(--off)} .dot.block{background:var(--block)}

#tree{
  flex:1;overflow:auto;padding:6px 4px 20px;
}
.node{margin:1px 0}
.row{
  display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:5px;
  cursor:pointer;user-select:none;font-size:13px;
}
.row:hover{background:var(--accent-soft)}
.row .caret{
  width:14px;text-align:center;font-size:10px;color:var(--muted);
  transition:transform .12s;
}
.row.collapsed .caret{transform:rotate(-90deg)}
.row input[type=checkbox]{
  margin:0;width:14px;height:14px;cursor:pointer;accent-color:var(--accent);
}
.row .label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.children{margin-left:14px;border-left:1px dashed var(--border);padding-left:2px}
.row.hidden{display:none}

/* ── Карта ───────────────────────────────────────────── */
#map{flex:1;min-width:0;background:var(--bg)}
.leaflet-container{background:var(--bg)}

/* иконки маркеров */
.pin{
  width:14px;height:14px;border-radius:50%;border:2px solid #fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.35),0 2px 4px rgba(0,0,0,.3);
}
.pin.ok{background:var(--ok)}
.pin.off{background:var(--off)}
.pin.block{background:var(--block)}
.pin.pulse{animation:pulse 1s infinite}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.7),0 0 0 1px rgba(0,0,0,.35)}
  50%{box-shadow:0 0 0 8px rgba(37,99,235,0),0 0 0 1px rgba(0,0,0,.35)}
}

/* всплывашка */
.leaflet-popup-content{margin:10px 12px;font-size:12px;line-height:1.5;min-width:220px;max-width:320px}
.pop-title{font-weight:600;font-size:13px;margin-bottom:6px}
.pop-row{display:flex;gap:8px;margin:2px 0}
.pop-row .k{color:var(--muted);min-width:70px}
.pop-row .v{word-break:break-word}
.pop-badge{
  display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;
  color:#fff;
}
.pop-badge.ok{background:var(--ok)}
.pop-badge.off{background:var(--off)}
.pop-badge.block{background:var(--block)}

/* диагностика */
#diag{
  display:none;position:absolute;left:12px;bottom:12px;right:12px;
  max-width:640px;max-height:40vh;overflow:auto;background:var(--panel);
  border:1px solid var(--border);border-radius:8px;padding:12px 14px;
  box-shadow:var(--shadow);font-size:12px;z-index:1000;
}
#diag h3{margin:0 0 6px;font-size:13px}
#diag code{background:var(--bg);padding:1px 5px;border-radius:4px}
#diag ul{margin:6px 0 0 18px;padding:0}
#diag li{margin:2px 0;color:var(--muted)}
#diag .close{
  position:absolute;top:8px;right:10px;background:transparent;border:0;
  cursor:pointer;color:var(--muted);font-size:16px;
}

/* мобильно */
@media (max-width:720px){
  #panel{position:absolute;inset:0 auto 0 0;width:80vw;z-index:900;
    transform:translateX(-100%);transition:transform .2s}
  #panel.open{transform:none}
  .stats{display:none}
}
</style>
</head>
<body>

<header>
  <h1>🛰️ GPON</h1>

  <button class="btn" id="btnGeo">📂 Excel с координатами</button>
  <button class="btn" id="btnCsv">📂 vgroups.csv</button>
  <input type="file" id="fileGeo" accept=".xlsx,.xls" multiple>
  <input type="file" id="fileCsv" accept=".csv,.txt">

  <div class="search">
    <input id="search" type="search" placeholder="Поиск: адрес, логин, ID, ветка, статус…">
  </div>

  <div class="stats">
    <span class="pill">Веток <b id="stBranches">0</b></span>
    <span class="pill">ONU <b id="stOnus">0</b></span>
    <span class="pill">На карте <b id="stMapped">0</b></span>
    <span class="pill">🔎 <b id="stFound">0</b></span>
  </div>

  <button class="btn ghost" id="btnDiag" title="Диагностика адресов">🩺</button>
  <button class="btn ghost" id="btnTheme" title="Тема">🌓</button>
  <button class="btn ghost" id="btnPanel" title="Панель" style="display:none">☰</button>
</header>

<main>
  <aside id="panel">
    <div class="panel-head">
      <span>Фильтр веток</span>
      <div class="actions">
        <button data-act="all">Все</button>
        <button data-act="none">Снять</button>
      </div>
    </div>
    <div class="statuses" id="statuses">
      <label><input type="checkbox" data-status="ok" checked><span class="dot ok"></span>Активна</label>
      <label><input type="checkbox" data-status="off" checked><span class="dot off"></span>Отключена</label>
      <label><input type="checkbox" data-status="block" checked><span class="dot block"></span>Заблокирована</label>
    </div>
    <div id="tree"></div>
  </aside>

  <div id="map"></div>

  <div id="diag">
    <button class="close" id="diagClose">✕</button>
    <h3>🩺 Диагностика сопоставления адресов</h3>
    <div id="diagBody"></div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
"use strict";

/* ════════════════════════════════════════════════════════════
   Состояние
   ════════════════════════════════════════════════════════════ */
const State = {
  geo: new Map(),      // normAddress -> {address, lat, lng}
  onus: [],            // {id, login, address, status, branch, group, subgroup, subsub, lat, lng}
  tree: null,          // вложенная структура веток
  selectedBranches: new Set(),   // полные имена выбранных веток
  statusFilter: { ok:true, off:true, block:true },
  search: "",
  mapped: 0,
  unmappedSamples: [],
  fileName: ""
};

/* ════════════════════════════════════════════════════════════
   Карта
   ════════════════════════════════════════════════════════════ */
const map = L.map("map", {
  preferCanvas: true,
  zoomControl: true,
  attributionControl: true
}).setView([45.25, 38.12], 9);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "© OpenStreetMap"
}).addTo(map);

const cluster = L.markerClusterGroup({
  chunkedLoading: true,
  chunkInterval: 100,
  chunkDelay: 20,
  maxClusterRadius: 55,
  disableClusteringAtZoom: 17,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false
});
map.addLayer(cluster);

/* кэш иконок — 3 штуки на всю карту */
const ICONS = {
  ok:    L.divIcon({className:"", html:'<div class="pin ok"></div>',    iconSize:[14,14], iconAnchor:[7,7], popupAnchor:[0,-8]}),
  off:   L.divIcon({className:"", html:'<div class="pin off"></div>',   iconSize:[14,14], iconAnchor:[7,7], popupAnchor:[0,-8]}),
  block: L.divIcon({className:"", html:'<div class="pin block"></div>', iconSize:[14,14], iconAnchor:[7,7], popupAnchor:[0,-8]})
};
const ICONS_PULSE = {
  ok:    L.divIcon({className:"", html:'<div class="pin ok pulse"></div>',    iconSize:[14,14], iconAnchor:[7,7], popupAnchor:[0,-8]}),
  off:   L.divIcon({className:"", html:'<div class="pin off pulse"></div>',   iconSize:[14,14], iconAnchor:[7,7], popupAnchor:[0,-8]}),
  block: L.divIcon({className:"", html:'<div class="pin block pulse"></div>', iconSize:[14,14], iconAnchor:[7,7], popupAnchor:[0,-8]})
};

/* ════════════════════════════════════════════════════════════
   Утилиты
   ════════════════════════════════════════════════════════════ */

/* нормализация адреса для сопоставления */
function normAddress(s){
  if(!s) return "";
  return String(s)
    .toLowerCase()
    .replace(/ё/g,"е")
    .replace(/\s+/g," ")
    .replace(/\s*,\s*/g,",")
    .replace(/\./g,"")
    .trim();
}

/* нормализация заголовка */
function normHeader(s){
  return String(s||"").toLowerCase().replace(/\s+/g," ").trim();
}

/* поиск колонки по возможным названиям */
function findCol(headers, variants){
  const norm = headers.map(normHeader);
  for(const v of variants){
    const i = norm.indexOf(v);
    if(i >= 0) return i;
  }
  // частичное совпадение
  for(const v of variants){
    const i = norm.findIndex(h => h.includes(v));
    if(i >= 0) return i;
  }
  return -1;
}

/* преобразование числа с десятичной запятой */
function toNum(v){
  if(v == null) return NaN;
  if(typeof v === "number") return v;
  const s = String(v).trim().replace(/\s/g,"").replace(",", ".");
  const n = parseFloat(s);
  return isFinite(n) ? n : NaN;
}

/* ════════════════════════════════════════════════════════════
   Определение ветки / группы / подгрупп
   ════════════════════════════════════════════════════════════ */

function getBranch(login){
  const s = String(login||"").trim();
  if(!s) return "(без логина)";
  const parts = s.split("/");
  if(parts.length >= 5){
    // {сегмент0}/{сегмент3}/{сегмент4} до знака ':'
    const seg4 = parts[4].split(":")[0];
    return `${parts[0]}/${parts[3]}/${seg4}`;
  }
  // меньше 5 сегментов — всё до ':'
  return s.split(":")[0];
}

function getBranchGroup(branch){
  const b = String(branch||"");
  if(b.startsWith("-")) return "— Прочие";
  if(/^slav/i.test(b)) return "slav*";
  if(/^bdcom-/i.test(b)) return "bdcom-*";
  return "— Прочие";
}

function getBranchSubgroup(branch){
  const b = String(branch||"");
  const i = b.indexOf("/");
  return i < 0 ? b : b.slice(0, i);
}

function getBranchSubsub(branch){
  const b = String(branch||"");
  const i = b.lastIndexOf("/");
  return i < 0 ? "" : b.slice(0, i);
}

/* статус из значения колонки «Блокировка» */
function parseStatus(v){
  const s = String(v||"").toLowerCase().trim();
  if(!s) return "ok";
  if(s.includes("блок")) return "block";
  if(s.includes("отключ") || s.includes("выключ") || s.includes("неактив")) return "off";
  if(s.includes("актив") || s.includes("вкл")) return "ok";
  return "ok";
}

const STATUS_LABEL = { ok:"Активна", off:"Отключена", block:"Заблокирована" };

/* ════════════════════════════════════════════════════════════
   Чтение Excel (geo_*.xlsx)
   ════════════════════════════════════════════════════════════ */

function readGeoWorkbook(wb, fileName){
  const sheet = wb.Sheets[wb.SheetNames[0]];
  if(!sheet) return 0;
  const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:""});

  // ищем строку заголовка в первых 30 строках
  let headerRow = -1, cols = null;
  for(let i = 0; i < Math.min(30, rows.length); i++){
    const r = rows[i] || [];
    const headers = r.map(c => String(c||""));
    const iAddr = findCol(headers, ["описание","адрес","address","description"]);
    const iLat  = findCol(headers, ["широта","latitude","lat"]);
    const iLng  = findCol(headers, ["долгота","longitude","lng","lon"]);
    if(iAddr >= 0 && iLat >= 0 && iLng >= 0){
      headerRow = i;
      cols = {iAddr, iLat, iLng};
      break;
    }
  }
  if(headerRow < 0) return 0;

  let added = 0;
  for(let i = headerRow + 1; i < rows.length; i++){
    const r = rows[i] || [];
    const addr = String(r[cols.iAddr]||"").trim();
    const lat = toNum(r[cols.iLat]);
    const lng = toNum(r[cols.iLng]);
    if(!addr || !isFinite(lat) || !isFinite(lng)) continue;
    if(lat < -90 || lat > 90 || lng < -180 || lng > 180) continue;
    const key = normAddress(addr);
    if(!State.geo.has(key)){
      State.geo.set(key, {address: addr, lat, lng});
      added++;
    }
  }
  return added;
}

/* ════════════════════════════════════════════════════════════
   Быстрый CSV-парсер (indexOf-ориентированный)
   ════════════════════════════════════════════════════════════ */

function detectDelimiter(text){
  const sample = text.slice(0, 4096);
  const counts = { ";":0, ",":0, "\t":0, "|":0 };
  for(const ch of sample) if(ch in counts) counts[ch]++;
  let best = ";", bestN = -1;
  for(const k in counts) if(counts[k] > bestN){ bestN = counts[k]; best = k; }
  return best;
}

function parseCSV(text, delim){
  const rows = [];
  let i = 0, len = text.length;
  let cur = [], field = "", inQuotes = false;

  while(i < len){
    const c = text[i];

    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += c; i++; continue;
    }

    if(c === '"'){ inQuotes = true; i++; continue; }
    if(c === delim){ cur.push(field); field = ""; i++; continue; }
    if(c === '\r'){ i++; continue; }
    if(c === '\n'){
      cur.push(field); field = "";
      rows.push(cur); cur = [];
      i++; continue;
    }
    field += c; i++;
  }
  cur.push(field);
  rows.push(cur);

  // убираем пустые хвосты
  while(rows.length && rows[rows.length-1].every(v => v === "")) rows.pop();
  return rows;
}

/* декодирование — UTF-8 или Windows-1251 */
function decodeBuffer(buf){
  // Проверяем BOM
  const bytes = new Uint8Array(buf);
  if(bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF){
    return new TextDecoder("utf-8").decode(buf);
  }
  // Пробуем UTF-8 strict
  try {
    return new TextDecoder("utf-8", {fatal:true}).decode(buf);
  } catch(e){
    return new TextDecoder("windows-1251").decode(buf);
  }
}

/* ════════════════════════════════════════════════════════════
   Обработка vgroups.csv
   ════════════════════════════════════════════════════════════ */

function processVgroups(text){
  if(!text) return;
  const delim = detectDelimiter(text);
  const rows = parseCSV(text, delim);
  if(rows.length < 2){
    alert("CSV пустой или не распознан.");
    return;
  }

  const headers = rows[0].map(h => String(h||"").trim());
  const iId    = findCol(headers, ["id","ид","id onu"]);
  const iLogin = findCol(headers, ["логин","login","name"]);
  const iAddr  = findCol(headers, ["адрес","address"]);
  const iBlock = findCol(headers, ["блокировка","статус","status","state"]);

  if(iLogin < 0 && iAddr < 0){
    alert("Не найдены колонки «Логин» и «Адрес». Проверьте заголовок CSV.");
    return;
  }

  const onus = [];
  State.unmappedSamples = [];

  for(let i = 1; i < rows.length; i++){
    const r = rows[i];
    if(!r || !r.length) continue;
    const login   = iLogin >= 0 ? String(r[iLogin]||"").trim() : "";
    const address = iAddr  >= 0 ? String(r[iAddr ]||"").trim() : "";
    const id      = iId    >= 0 ? String(r[iId   ]||"").trim() : "";
    const status  = parseStatus(iBlock >= 0 ? r[iBlock] : "");

    if(!login && !address) continue;

    const branch   = getBranch(login);
    const group    = getBranchGroup(branch);
    const subgroup = getBranchSubgroup(branch);
    const subsub   = getBranchSubsub(branch);

    // ищем координаты
    const key = normAddress(address);
    const g = State.geo.get(key);
    let lat = null, lng = null;
    if(g){ lat = g.lat; lng = g.lng; }
    else if(address && State.unmappedSamples.length < 15 && !State.unmappedSamples.includes(address)){
      State.unmappedSamples.push(address);
    }

    onus.push({ id, login, address, status, branch, group, subgroup, subsub, lat, lng });
  }

  State.onus = onus;
  State.mapped = onus.filter(o => o.lat != null).length;

  buildTree();
  rebuildFilterUI();
  applyFilters();
  updateStats();
}

/* ════════════════════════════════════════════════════════════
   Построение дерева веток
   ════════════════════════════════════════════════════════════ */

function buildTree(){
  const root = { name:"", children:new Map(), count:0, selfCount:0 };
  let totalBranches = 0;

  for(const o of State.onus){
    const g = o.group, sg = o.subgroup, ss = o.subsub, br = o.branch;

    let nodeG = root.children.get(g);
    if(!nodeG){ nodeG = { name:g, level:1, children:new Map(), count:0, selfCount:0 }; root.children.set(g, nodeG); }

    let nodeSg = nodeG.children.get(sg);
    if(!nodeSg){ nodeSg = { name:sg, level:2, children:new Map(), count:0, selfCount:0 }; nodeG.children.set(sg, nodeSg); }

    let parentForBranch = nodeSg;
    if(ss && ss !== sg){
      let nodeSs = nodeSg.children.get(ss);
      if(!nodeSs){ nodeSs = { name:ss, level:3, children:new Map(), count:0, selfCount:0 }; nodeSg.children.set(ss, nodeSs); }
      parentForBranch = nodeSs;
    }

    let nodeBr = parentForBranch.children.get(br);
    if(!nodeBr){ nodeBr = { name:br, level:4, children:new Map(), count:0, selfCount:0 }; parentForBranch.children.set(br, nodeBr); totalBranches++; }
    nodeBr.selfCount++;
  }

  // пересчёт count снизу вверх
  function recount(node){
    let total = node.selfCount;
    for(const c of node.children.values()) total += recount(c);
    node.count = total;
    return total;
  }
  recount(root);

  State.tree = root;
  State.branchTotal = totalBranches;

  // по умолчанию — все ветки выбраны
  State.selectedBranches = new Set();
  (function collect(n){
    for(const c of n.children.values()){
      if(c.level === 4) State.selectedBranches.add(c.name);
      else collect(c);
    }
  })(root);
}

/* ════════════════════════════════════════════════════════════
   Отрисовка дерева фильтров
   ════════════════════════════════════════════════════════════ */

const treeEl = document.getElementById("tree");

function rebuildFilterUI(){
  treeEl.innerHTML = "";
  if(!State.tree) return;

  const frag = document.createDocumentFragment();

  // сортировка: группы — slav*, bdcom-*, Прочие
  const groups = [...State.tree.children.values()].sort((a,b) => {
    const order = g => g.name === "slav*" ? 0 : g.name === "bdcom-*" ? 1 : 2;
    const d = order(a) - order(b);
    return d !== 0 ? d : a.name.localeCompare(b.name, "ru");
  });

  for(const g of groups) frag.appendChild(renderNode(g, 1));
  treeEl.appendChild(frag);
}

function renderNode(node, level){
  const wrap = document.createElement("div");
  wrap.className = "node";

  const row = document.createElement("div");
  row.className = "row";
  row.dataset.level = level;

  const caret = document.createElement("span");
  caret.className = "caret";
  caret.textContent = node.children.size ? "▼" : "•";
  row.appendChild(caret);

  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.dataset.name = node.name;
  cb.dataset.level = level;
  cb.checked = level === 4 ? State.selectedBranches.has(node.name) : true;
  cb.addEventListener("click", e => e.stopPropagation());
  cb.addEventListener("change", () => {
    toggleNode(node, cb.checked);
    applyFilters();
  });
  row.appendChild(cb);

  const lbl = document.createElement("span");
  lbl.className = "label";
  lbl.textContent = node.name || "(без имени)";
  row.appendChild(lbl);

  const cnt = document.createElement("span");
  cnt.className = "count";
  cnt.textContent = node.count;
  row.appendChild(cnt);

  row.addEventListener("click", e => {
    if(e.target.tagName === "INPUT") return;
    if(node.children.size){
      wrap.classList.toggle("collapsed");
      row.classList.toggle("collapsed", wrap.classList.contains("collapsed"));
    }
  });

  wrap.appendChild(row);

  if(node.children.size){
    const kids = document.createElement("div");
    kids.className = "children";
    const arr = [...node.children.values()].sort((a,b) =>
      a.name.localeCompare(b.name, "ru", {numeric:true}));
    for(const k of arr) kids.appendChild(renderNode(k, level + 1));
    wrap.appendChild(kids);
  }

  return wrap;
}

/* переключить узел и всех потомков */
function toggleNode(node, checked){
  if(node.level === 4){
    if(checked) State.selectedBranches.add(node.name);
    else State.selectedBranches.delete(node.name);
    return;
  }
  for(const c of node.children.values()) toggleNode(c, checked);
  // синхронизируем чекбоксы в DOM
  syncCheckboxes();
}

function syncCheckboxes(){
  treeEl.querySelectorAll("input[type=checkbox]").forEach(cb => {
    const lvl = +cb.dataset.level;
    if(lvl === 4){
      cb.checked = State.selectedBranches.has(cb.dataset.name);
    } else {
      // состояние «частично выбран» — через indeterminate
      const node = findNodeByName(State.tree, cb.dataset.name, lvl);
      if(!node){ cb.checked = false; cb.indeterminate = false; return; }
      const leaves = collectLeaves(node);
      const sel = leaves.filter(n => State.selectedBranches.has(n)).length;
      cb.checked = sel === leaves.length && leaves.length > 0;
      cb.indeterminate = sel > 0 && sel < leaves.length;
    }
  });
}

function findNodeByName(root, name, level){
  if(!root) return null;
  for(const c of root.children.values()){
    if(c.level === level && c.name === name) return c;
    const r = findNodeByName(c, name, level);
    if(r) return r;
  }
  return null;
}

function collectLeaves(node){
  const out = [];
  (function walk(n){
    if(n.level === 4){ out.push(n.name); return; }
    for(const c of n.children.values()) walk(c);
  })(node);
  return out;
}

/* массовые действия */
document.querySelector(".panel-head .actions").addEventListener("click", e => {
  const act = e.target.dataset.act;
  if(!act) return;
  if(act === "all"){
    State.selectedBranches = new Set();
    (function walk(n){
      for(const c of n.children.values()){
        if(c.level === 4) State.selectedBranches.add(c.name);
        else walk(c);
      }
    })(State.tree);
  } else if(act === "none"){
    State.selectedBranches = new Set();
  }
  syncCheckboxes();
  applyFilters();
});

/* ════════════════════════════════════════════════════════════
   Статусы
   ════════════════════════════════════════════════════════════ */

document.getElementById("statuses").addEventListener("change", e => {

  if(!cb) return;
  State.statusFilter[cb.dataset.status] = cb.checked;

/* ════════════════════════════════════════════════════════════
   Поиск (debounce 180 мс)
   ════════════════════════════════════════════════════════════ */

let searchTimer = null;
document.getElementById("search").addEventListener("input", e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    State.search = e.target.value.trim().toLowerCase();
    applyFilters();
    filterTreeBySearch();
  }, 180);
});

/* фильтрация самого дерева по поисковой строке */
function filterTreeBySearch(){
  const q = State.search;
  treeEl.querySelectorAll(".node").forEach(n => {
    const row = n.querySelector(":scope > .row");
    const label = row.querySelector(".label").textContent.toLowerCase();
    const nodeEl = n;
    if(!q){
      nodeEl.classList.remove("hidden");
      return;
    }
    // если есть подходящие потомки — показываем
    const hasMatch = label.includes(q) || hasMatchingChild(nodeEl, q);
    nodeEl.classList.toggle("hidden", !hasMatch);
  });
}

function hasMatchingChild(nodeEl, q){
  const labels = nodeEl.querySelectorAll(".children .label");
  for(const l of labels){
    if(l.textContent.toLowerCase().includes(q)) return true;
  }
  return false;
}

/* ════════════════════════════════════════════════════════════
   Применение фильтров — перерисовка карты
   ════════════════════════════════════════════════════════════ */

const geoIndex = new Map(); // id onu -> L.marker (для повторного использования)

function applyFilters(){
  cluster.clearLayers();
  geoIndex.clear();

  const q = State.search;
  const sf = State.statusFilter;
  const selected = State.selectedBranches;
  let shown = 0;
  let found = 0;

  const group = [];

  for(const o of State.onus){
    if(o.lat == null) continue;
    if(!sf[o.status]) continue;
    if(!selected.has(o.branch)) continue;

    let matched = false;
    if(q){
      const hay = (o.address + " " + o.login + " " + o.id + " " + o.branch + " " + STATUS_LABEL[o.status]).toLowerCase();
      if(hay.includes(q)) matched = true;
      else continue;
    }
    if(q) found++;

    const icon = matched ? ICONS_PULSE[o.status] : ICONS[o.status];
    const m = L.marker([o.lat, o.lng], { icon, title:o.login || o.address });
    m.bindPopup(popupHtml(o), {
      autoClose:false,
      closeOnClick:false,
      autoPan:false,
      closeButton:true,
      maxWidth:340
    });
    m.on("mouseover", function(){ this.openPopup(); });
    // НЕ закрываем при mouseout — по требованию
    group.push(m);
    shown++;
  }

  cluster.addLayers(group);
  updateStats(found);

  if(shown > 0 && cluster.getBounds().isValid()){
    map.fitBounds(cluster.getBounds(), {padding:[30,30], maxZoom:16});
  }
}

function popupHtml(o){
  const badge = `<span class="pop-badge ${o.status}">${STATUS_LABEL[o.status]}</span>`;
  return `
    <div class="pop-title">${escapeHtml(o.login || "(без логина)")}</div>
    <div class="pop-row"><span class="k">ID:</span><span class="v">${escapeHtml(o.id || "—")}</span></div>
    <div class="pop-row"><span class="k">Ветка:</span><span class="v">${escapeHtml(o.branch)}</span></div>
    <div class="pop-row"><span class="k">Статус:</span><span class="v">${badge}</span></div>
    <div class="pop-row"><span class="k">Адрес:</span><span class="v">${escapeHtml(o.address || "—")}</span></div>
  `;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

/* ════════════════════════════════════════════════════════════
   Статистика
   ════════════════════════════════════════════════════════════ */

function updateStats(found){
  document.getElementById("stBranches").textContent = State.branchTotal || 0;
  document.getElementById("stOnus").textContent = State.onus.length;
  document.getElementById("stMapped").textContent = State.mapped;
  document.getElementById("stFound").textContent = found == null ? State.onus.length : found;
}

/* ════════════════════════════════════════════════════════════
   Загрузка файлов
   ════════════════════════════════════════════════════════════ */

const fileGeo = document.getElementById("fileGeo");
const fileCsv = document.getElementById("fileCsv");

document.getElementById("btnGeo").addEventListener("click", () => fileGeo.click());
document.getElementById("btnCsv").addEventListener("click", () => fileCsv.click());

fileGeo.addEventListener("change", async e => {
  const files = [...e.target.files];
  if(!files.length) return;

  const nonGeo = files.filter(f => !/^geo/i.test(f.name));
  if(nonGeo.length){
    if(!confirm(`Файлы не начинаются на "geo":\n${nonGeo.map(f=>f.name).join("\n")}\n\nПродолжить?`)){
      e.target.value = "";
      return;
    }
  }

  try {
    const results = await Promise.all(files.map(readFileAsArrayBuffer));
    let added = 0;
    for(let i = 0; i < files.length; i++){
      const wb = XLSX.read(results[i], {type:"array"});
      added += readGeoWorkbook(wb, files[i].name);
    }
    console.log(`[geo] загружено адресов: ${added}, всего в индексе: ${State.geo.size}`);

    // если уже есть ONU — пересчитываем координаты
    if(State.onus.length) reprocessCoordinates();

  } catch(err){
    console.error(err);
    alert("Ошибка чтения Excel: " + err.message);
  } finally {
    e.target.value = "";
  }
});

fileCsv.addEventListener("change", async e => {
  const f = e.target.files[0];
  if(!f) return;
  try {
    const buf = await readFileAsArrayBuffer(f);
    const text = decodeBuffer(buf);
    processVgroups(text);
  } catch(err){
    console.error(err);
    alert("Ошибка чтения CSV: " + err.message);
  } finally {
    e.target.value = "";
  }
});

function readFileAsArrayBuffer(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsArrayBuffer(file);
  });
}

/* пересчёт координат после догрузки geo-файлов */
function reprocessCoordinates(){
  State.unmappedSamples = [];
  State.mapped = 0;
  for(const o of State.onus){
    const g = State.geo.get(normAddress(o.address));
    if(g){ o.lat = g.lat; o.lng = g.lng; State.mapped++; }
    else {
      o.lat = null; o.lng = null;
      if(o.address && State.unmappedSamples.length < 15) State.unmappedSamples.push(o.address);
    }
  }
  applyFilters();
}

/* ════════════════════════════════════════════════════════════
   Диагностика
   ════════════════════════════════════════════════════════════ */

document.getElementById("btnDiag").addEventListener("click", () => {
  const el = document.getElementById("diag");
  el.style.display = el.style.display === "block" ? "none" : "block";
  renderDiag();
});
document.getElementById("diagClose").addEventListener("click", () => {
  document.getElementById("diag").style.display = "none";
});

function renderDiag(){
  const body = document.getElementById("diagBody");
  const unmappedCount = State.onus.filter(o => o.lat == null).length;

  const geoRegions = new Set();
  for(const v of State.geo.values()){
    const m = String(v.address).match(/р-н\s+([^,]+)/i);
    geoRegions.add(m ? m[1].trim() : "(без района)");
  }

  const onuRegions = new Set();
  for(const o of State.onus){
    const m = String(o.address).match(/р-н\s+([^,]+)/i);
    onuRegions.add(m ? m[1].trim() : "(без района)");
  }

  body.innerHTML = `
    <div style="margin-bottom:8px">
      Адресов в geo: <code>${State.geo.size}</code> ·
      ONU: <code>${State.onus.length}</code> ·
      с координатами: <code>${State.mapped}</code> ·
      без координат: <code>${unmappedCount}</code>
    </div>
    <div style="margin-bottom:6px"><b>Районы в geo:</b> ${[...geoRegions].map(r=>`<code>${escapeHtml(r)}</code>`).join(" ") || "—"}</div>
    <div style="margin-bottom:6px"><b>Районы в vgroups:</b> ${[...onuRegions].map(r=>`<code>${escapeHtml(r)}</code>`).join(" ") || "—"}</div>
    ${unmappedCount ? `<div style="margin-top:8px"><b>Примеры адресов без координат:</b></div>
      <ul>${State.unmappedSamples.map(a => `<li>${escapeHtml(a)}</li>`).join("")}</ul>` : `<div style="margin-top:8px;color:var(--ok)">✅ Все адреса сопоставлены.</div>`}
  `;
}
